function matchHTML(t,m){if(!real(m.a)&&!real(m.b))return'';if(m.bye&&!real(m.a)&&m.br!=='W')return'';
 const nm=id=>id==='BYE'?'<span class="muted">Freilos</span>':id?`${AV(U(id))} ${(t.out||[]).includes(id)?`<s style="opacity:.6">${esc(U(id).nick)}</s>`:esc(U(id).nick)}`:'<span class="muted">—</span>';
 const cls=id=>m.winner==='DRAW'?'':m.winner&&!m.bye?(m.winner===id?'w':'l'):m.bye&&real(id)?'w':'';
 const gm=m.winner&&!m.bye&&S.games.find(g=>g.mid===m.id);
 return `<div class="match"${gm?` style="cursor:pointer" title="Spiel-Details ansehen" onclick="gameDetail('${gm.id}')"`:''}>${playable(m)?`<div class="row small" style="margin-bottom:4px">${m.board?`<span class="badge g">Board ${m.board}</span>`:t.mode==='league'&&m.r!==curDay(t)?`<span class="badge">geplant</span>`:`<span class="badge">wartet auf Board</span>`}<span class="sp"></span><span class="muted">${fmtShort(fmtOf(t,m))}</span></div>`:m.winner==='DRAW'?`<div class="small" style="margin-bottom:4px"><span class="badge y">🤝 Unentschieden</span></div>`:m.wo?`<div class="small" style="margin-bottom:4px"><span class="badge">🏳️ kampflos</span></div>`:''}
 <div class="pl ${cls(m.a)}"><span>${nm(m.a)}</span><b>${m.winner&&!m.bye?m.la:''}</b></div>
 <div class="pl ${cls(m.b)}"><span>${nm(m.b)}</span><b>${m.winner&&!m.bye?m.lb:''}</b></div>${gm?'<div class="muted small" style="text-align:right;margin-top:2px">📊 Details ›</div>':''}
 ${canPlay(m)||(isStaff()&&playable(m))?`<div class="row" style="margin-top:6px">${canPlay(m)?`<button class="pri sm sp" onclick="playMatch('${t.id}','${m.id}')">▶ Spielen</button>`:''}${isStaff()?`<button class="sm" onclick="manualRes('${t.id}','${m.id}')" title="Ergebnis von Hand eintragen">✎ Ergebnis</button>`:''}</div>`:''}</div>`;}
function bracketHTML(t,br,rounds,nameFn){return `<div class="bracket">${rounds.map(r=>{const inner=t.matches.filter(m=>m.br===br&&m.r===r).sort((a,b)=>a.s-b.s).map(m=>matchHTML(t,m)).join('');
 return inner?`<div class="round"><div class="muted small" style="text-align:center">${nameFn(r)}</div>${inner}</div>`:'';}).join('')}</div>`;}
function rName(t,r){const left=t.rounds-r;return left===1?'Finale':left===2?'Halbfinale':left===3?'Viertelfinale':left===4?'Achtelfinale':'Runde '+(r+1);}
const rng=n=>[...Array(n).keys()];
let TOUT=[];const tnm=id=>TOUT.includes(id)?`<s style="opacity:.6">${esc(U(id).nick)}</s> <span class="badge r">gestrichen</span>`:esc(U(id).nick);
const tblHTML=(rows,extra)=>`<table><tr><th>#</th><th>Spieler</th><th>Sp.</th><th>S</th><th>U</th><th>Ergebnis</th><th>Pkt.</th>${extra?'<th>Buchh.</th>':''}</tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${AV(U(r.id))} ${tnm(r.id)}</td><td>${r.sp}</td><td>${r.s}</td><td>${r.u}</td><td>${r.lf}:${r.la}</td><td><b>${r.pts}</b></td>${extra?`<td>${r.bh}</td>`:''}</tr>`).join('')}</table>`;
const openFirst=ms=>ms.slice().sort((a,b)=>(!!a.winner)-(!!b.winner)||a.r-b.r);
function vTourView(id){const t=S.tournaments.find(x=>x.id===id);if(!t){view='tour';return vTour();}
 TOUT=t.out||[];let body='';
 if(t.mode==='ko'||(t.mode==='groups'&&t.phase==='ko'))body+=`<div class="card"><h3>${t.mode==='groups'?'K.-o.-Runde':'Turnierbaum'}</h3>${bracketHTML(t,'W',rng(t.rounds),r=>rName(t,r))}</div>`;
 if(t.mode==='dko'){body+=`<div class="card"><h3>Gewinnerrunde</h3>${bracketHTML(t,'W',rng(t.rounds),r=>r===t.rounds-1?'WB-Finale':'Runde '+(r+1))}</div>`;
  if(t.lrounds)body+=`<div class="card"><h3>Verliererrunde</h3>${bracketHTML(t,'L',rng(t.lrounds).map(i=>i+1),r=>r===t.lrounds?'LB-Finale':'V-Runde '+r)}</div>`;
  body+=`<div class="card"><h3>Grand Final</h3><div style="max-width:260px">${t.matches.filter(m=>m.br==='GF').map(m=>matchHTML(t,m)).join('')}</div></div>`;}
 if(t.mode==='groups')t.groups.forEach((g,gi)=>{const ms=t.matches.filter(m=>m.br==='G'&&m.g===gi);
  body+=`<div class="card" style="overflow-x:auto"><h3>Gruppe ${String.fromCharCode(65+gi)} <span class="muted small">· die besten ${t.qual} kommen weiter</span></h3>${tblHTML(table(g,ms))}
  <div class="grid2" style="margin-top:12px">${openFirst(ms).map(m=>matchHTML(t,m)).join('')}</div></div>`;});
 if(t.mode==='swiss'){body+=`<div class="card" style="overflow-x:auto"><h3>Tabelle <span class="muted small">· Runde ${t.curRound} von ${t.swissRounds}</span></h3>${tblHTML(swissTable(t),true)}</div>`;
  for(let r=t.curRound;r>=1;r--)body+=`<div class="card"><h3>Runde ${r}</h3><div class="grid2">${t.matches.filter(m=>m.br==='S'&&m.r===r).map(m=>matchHTML(t,m)).join('')}</div></div>`;}
 if(t.mode==='league')body+=leagueView(t);
 if(t.mode==='rr')body+=`<div class="card" style="overflow-x:auto"><h3>Tabelle</h3>${tblHTML(table(t.players,t.matches))}</div><div class="card"><h3>Spiele</h3><div class="grid2">${openFirst(t.matches).map(m=>matchHTML(t,m)).join('')}</div></div>`;
 const tg=S.games.filter(g=>g.tid===t.id);const best={};tg.forEach(g=>g.players.forEach(p=>{const a=p.pts/p.darts*3;if(!best[p.id]||a>best[p.id])best[p.id]=a;}));
 const ba=Object.entries(best).sort((a,b)=>b[1]-a[1])[0];
 if(TV_TAB==='stats')body=tourStatsHTML(t);
 const kids=S.tournaments.filter(x=>x.parent===t.id),par=t.parent&&S.tournaments.find(x=>x.id===t.parent);
 return `<div class="row" style="margin-bottom:12px"><button class="sm ghost" onclick="TOUR_BACK==='club'?(clubTab='tours',go('club')):go(isStaff()?'tour':'home')">← Zurück</button><h2 class="sp" style="margin:0">${esc(t.name)}</h2>
 ${isStaff()?`<button class="sm ghost" onclick="tourAdjust('${t.id}')">⚙️ Turnier anpassen</button>`:''}${isStaff()&&t.status!=='done'?`<button class="sm ghost" onclick="tourOutDlg('${t.id}')">👤 Spieler streichen</button>`:''}${me().role==='admin'?`<button class="sm red" onclick="delTour('${t.id}')">Löschen</button>`:''}</div>
 <div class="muted small" style="margin-bottom:12px">${t.kind==='training'?'Training':'Turnier'} · ${MODES[t.mode]} · ${t.start} · ${fmtStr(tFmt(t))}${t.bestOfFinal&&['ko','dko','groups'].includes(t.mode)?` (Finale Best of ${t.bestOfFinal})`:''} · ${t.dOut?'Double Out':'Single Out'} · Boards ${(t.boards||[]).join(', ')}</div>
 ${t.status==='done'?`<div class="banner"><h3 style="margin:0">🏆 Sieger: ${AV(U(t.winner))} ${esc(U(t.winner).nick)}</h3></div>`:''}
 ${par?`<div class="banner" style="cursor:pointer" onclick="TV_TAB='games';go('tourview','${par.id}')">↩ Gehört zu <b>${esc(par.name)}</b> – antippen zum Öffnen</div>`:''}${kids.map(k=>`<div class="banner" style="cursor:pointer" onclick="TV_TAB='games';go('tourview','${k.id}')">🏆 <b>${esc(k.name)}</b> ${k.status==='done'?`· Sieger ${esc(U(k.winner).nick)}`:'· läuft'} – antippen zum Öffnen</div>`).join('')}
 ${ba&&TV_TAB!=='stats'?`<div class="muted small" style="margin-bottom:12px">Bester Match-Average: <b style="color:var(--text)">${esc(U(ba[0]).nick)} – ${f1(ba[1])}</b></div>`:''}
 <div class="seg" style="margin-bottom:12px"><button class="${TV_TAB!=='stats'?'on':''}" onclick="TV_TAB='games';render()">🎯 Spiele</button><button class="${TV_TAB==='stats'?'on':''}" onclick="TV_TAB='stats';render()">📊 Statistiken</button></div>${body}`;}

/* ===================== Laufendes Turnier anpassen, K.-o.-Runde anhängen, Turnier-Statistik ===================== */
let TV_TAB='games';
function seedPairs(ids){let size=2;while(size<ids.length)size*=2;const sl=[...ids];while(sl.length<size)sl.push('BYE');const pairs=[];for(let i=0;i<size/2;i++)pairs.push([sl[i],sl[size-1-i]]);return seededSlots(pairs);}
function tourStand(t){const out=t.out||[];let ids;
 if(t.mode==='swiss')ids=swissTable(t).map(r=>r.id);else if(t.mode==='rr')ids=table(t.players,t.matches).map(r=>r.id);else if(t.mode==='league')ids=leagueTable(t).map(r=>r.id);
 else if(t.mode==='groups'){const tabs=t.groups.map((g,gi)=>table(g,t.matches.filter(m=>m.br==='G'&&m.g===gi)).map(r=>r.id));ids=[];const mx=Math.max(...tabs.map(x=>x.length));for(let p=0;p<mx;p++)tabs.forEach(tb=>{if(tb[p])ids.push(tb[p]);});}
 else{const w={};t.players.forEach(id=>w[id]=0);t.matches.forEach(m=>{if(m.winner&&!m.bye&&w[m.winner]!=null)w[m.winner]++;});ids=t.players.slice().sort((a,b)=>(b===t.winner)-(a===t.winner)||w[b]-w[a]);}
 return ids.filter(id=>!out.includes(id));}
function tourAdjust(tid){const t=S.tournaments.find(x=>x.id===tid);if(!t)return;const f=tFmt(t);const u=f.sets?'Sets':'Legs';const ko=['ko','dko','groups'].includes(t.mode);
 const open=t.matches.filter(playable).length;
 modal(`<h3>⚙️ Turnier anpassen</h3><p class="muted small" style="margin-top:0">Änderungen gelten für alle Spiele, die noch nicht gestartet sind. Laufende und fertige Spiele bleiben, wie sie sind.</p>
 ${t.status!=='done'?`${stepperHTML(`Spiele: Best of ${f.bo} ${u}`,f.bo,`tourFmt('${tid}','bo',-1)`,`tourFmt('${tid}','bo',1)`,f.bo>1,f.bo<11,`Wer zuerst ${fmtNeed(f.bo)} ${u} hat, gewinnt`)}
 ${ko&&t.bestOfFinal?stepperHTML(`Finale: Best of ${t.bestOfFinal} ${u}`,t.bestOfFinal,`tourFmt('${tid}','fin',-1)`,`tourFmt('${tid}','fin',1)`,t.bestOfFinal>1,t.bestOfFinal<11):''}`:''}
 ${t.mode==='swiss'?`<div class="sec">Schweizer System</div><p class="muted small" style="margin-top:0">Gespielt wird bis Runde <b style="color:var(--text)">${t.swissRounds}</b>, aktuell Runde ${t.curRound}.</p><div class="row"><button class="pri sp" onclick="tourSwissMore('${tid}')">＋ Eine Runde mehr</button>${t.swissRounds>t.curRound?`<button class="ghost sp" onclick="tourSwissLess('${tid}')">− Eine Runde weniger</button>`:''}</div>`:''}
 ${!['ko','dko','groups'].includes(t.mode)&&!t.parent?`<div class="sec">K.-o.-Runde anhängen</div><p class="muted small" style="margin-top:0">Startet aus diesem Turnier eine K.-o.-Runde. Gesetzt wird nach der aktuellen Tabelle: Platz 1 spielt gegen den Letzten, Platz 2 gegen den Vorletzten usw.${open?` <b style="color:var(--gold)">Achtung: Es sind noch ${open} Spiele offen.</b>`:''}</p><button class="pri" style="width:100%" onclick="koDlg('${tid}')">🏆 K.-o.-Runde starten …</button>`:''}
 <button class="ghost" style="width:100%;margin-top:14px" onclick="closeModal()">Fertig</button>`);}
function tourFmt(tid,k,d){const t=S.tournaments.find(x=>x.id===tid);if(!t)return;if(k==='bo'){t.fmt={...tFmt(t)};t.fmt.bo=stepBo(t.fmt.bo%2?t.fmt.bo:t.fmt.bo-1,d,false);delete t.bestOf;}else t.bestOfFinal=stepBo(t.bestOfFinal,d,false);save();tourAdjust(tid);render();}
function tourSwissMore(tid){const t=S.tournaments.find(x=>x.id===tid);if(!t)return;t.swissRounds++;
 if(t.status==='done'){t.status='open';t.winner=null;pairSwiss(t,t.curRound+1);woSweep(t);assignAll();toast(`Runde ${t.curRound} ist ausgelost`);}else toast(`Jetzt ${t.swissRounds} Runden`);save();tourAdjust(tid);render();}
function tourSwissLess(tid){const t=S.tournaments.find(x=>x.id===tid);if(!t||t.swissRounds<=t.curRound)return;t.swissRounds--;checkPhase(t);assignAll();save();tourAdjust(tid);render();}
let KO_SEL=null,KO_BO=3;
function koDlg(tid){const t=S.tournaments.find(x=>x.id===tid);if(!t)return;const st=tourStand(t);if(!KO_SEL||KO_SEL.tid!==tid){KO_SEL={tid,ids:new Set(st.slice(0,Math.min(8,2**Math.floor(Math.log2(Math.max(2,st.length))))))};KO_BO=Math.max(3,tFmt(t).bo%2?tFmt(t).bo:tFmt(t).bo+1);}
 const n=KO_SEL.ids.size;
 modal(`<h3>🏆 K.-o.-Runde starten</h3><p class="muted small" style="margin-top:0">Wer soll weiterkommen? Reihenfolge = aktuelle Tabelle (gesetzt wird danach).</p>
 <div class="chips" style="margin-bottom:8px">${[2,4,8,16].filter(k=>k<=st.length).map(k=>`<button onclick="KO_SEL.ids=new Set(tourStand(S.tournaments.find(x=>x.id==='${tid}')).slice(0,${k}));koDlg('${tid}')">Top ${k}</button>`).join('')}<button onclick="KO_SEL.ids=new Set(tourStand(S.tournaments.find(x=>x.id==='${tid}')));koDlg('${tid}')">Alle</button></div>
 <div style="display:grid;gap:4px;max-height:40vh;overflow:auto">${st.map((id,i)=>`<label class="row" style="flex-wrap:nowrap;margin:0;padding:6px 4px;border-top:1px solid var(--line);cursor:pointer"><input type="checkbox" style="width:auto" ${KO_SEL.ids.has(id)?'checked':''} onchange="this.checked?KO_SEL.ids.add('${id}'):KO_SEL.ids.delete('${id}');koDlg('${tid}')"><span class="muted" style="width:26px">${i+1}.</span><span class="sp">${AV(U(id))} ${esc(U(id).nick)}</span></label>`).join('')}</div>
 ${stepperHTML(`K.-o.-Spiele: Best of ${KO_BO} ${tFmt(t).sets?'Sets':'Legs'}`,KO_BO,`KO_BO=stepBo(KO_BO,-1,false);koDlg('${tid}')`,`KO_BO=stepBo(KO_BO,1,false);koDlg('${tid}')`,KO_BO>1,KO_BO<11)}
 <p class="muted small">${n} Spieler${n>=2&&(n&(n-1))?` – ${2**Math.ceil(Math.log2(n))-n} Freilos${2**Math.ceil(Math.log2(n))-n===1?'':'e'} für die Besten`:''}</p>
 <div class="row"><button class="ghost sp" onclick="tourAdjust('${tid}')">Zurück</button><button class="pri sp" ${n<2?'disabled':''} onclick="koStart('${tid}')">K.-o.-Runde auslosen</button></div>`);}
function koStart(tid){const t=S.tournaments.find(x=>x.id===tid);if(!t||!KO_SEL)return;const ids=tourStand(t).filter(id=>KO_SEL.ids.has(id));if(ids.length<2)return toast('Mindestens 2 Spieler');
 const k=makeTour({name:t.name+' – K.-o.-Runde',kind:t.kind,mode:'ko',start:t.start,fmt:{...tFmt(t),bo:KO_BO},bestOfFinal:KO_BO,dOut:t.dOut,boards:(t.boards||[]).slice(),players:ids,seed:ids,parent:t.id});
 if(t.status!=='done'&&!t.matches.some(playable)){}KO_SEL=null;closeModal();toast('🏆 K.-o.-Runde ist ausgelost');TV_TAB='games';go('tourview',k.id);}
function tourStatsHTML(t){const fam=[t.id,...S.tournaments.filter(x=>x.parent===t.id).map(x=>x.id)];const gs=S.games.filter(g=>fam.includes(g.tid));
 const R={};const row=id=>R[id]=R[id]||{id,sp:0,s:0,lw:0,ll:0,darts:0,pts:0,best:0,f9:0,f9n:0,s180:0,s140:0,s100:0,hiCo:0,bl:null,co:0};
 gs.forEach(g=>g.players.forEach((p,pi)=>{const r=row(p.id);r.sp++;if(p.won)r.s++;r.lw+=p.legs||0;g.players.forEach((q,qi)=>{if(qi!==pi)r.ll+=q.legs||0;});r.darts+=p.darts;r.pts+=p.pts;const a=p.darts?p.pts/p.darts*3:0;if(a>r.best)r.best=a;
  r.f9+=p.f9||0;r.f9n+=p.f9n||0;r.s180+=p.s180||0;r.s140+=p.s140||0;r.s100+=p.s100||0;r.hiCo=Math.max(r.hiCo,p.hiCo||0);r.co+=p.co||0;
  (g.lg||[]).forEach(l=>{if(l.w!==pi)return;const d=l.v.filter(x=>x[0]===pi).reduce((s,x)=>s+x[2],0);if(d&&(r.bl==null||d<r.bl))r.bl=d;});}));
 const rows=Object.values(R).sort((a,b)=>(b.darts?b.pts/b.darts:0)-(a.darts?a.pts/a.darts:0));
 if(!rows.length)return `<div class="card muted">Noch keine durchgetippten Spiele in diesem Turnier. Statistiken gibt es für Spiele, die am Tablet gespielt wurden (nicht für von Hand eingetragene Ergebnisse).</div>`;
 const top=(fn,fmt,lbl,ic,low)=>{const c=rows.filter(r=>fn(r)!=null&&fn(r)>0);if(!c.length)return '';const b=c.reduce((x,y)=>(low?fn(y)<fn(x):fn(y)>fn(x))?y:x);return `<div class="stat"><div class="v">${fmt(fn(b))}</div><div class="k">${ic} ${lbl}</div><div class="muted small" style="margin-top:2px">${esc(U(b.id).nick)}</div></div>`;};
 const av=r=>r.darts?r.pts/r.darts*3:null;

function doWO(tid,mid,side){const t=S.tournaments.find(x=>x.id===tid),m=t&&t.matches.find(x=>x.id===mid);if(!m||m.winner)return;const need=fmtNeed(fmtOf(t,m).bo);
 m.wo=true;applyResult(tid,mid,side==='a'?m.a:m.b,side==='a'?need:0,side==='a'?0:need);save();closeModal();render();toast('🏳️ Kampflos eingetragen');}
/* --- Spieler aus dem Turnier streichen: alle weiteren Spiele gewinnt der Gegner kampflos --- */
function woSweep(t){const out=t.out||[];if(!out.length||t.status==='done')return;let guard=0,again=true;
 while(again&&guard++<500){again=false;const m=t.matches.find(m=>playable(m)&&(out.includes(m.a)||out.includes(m.b)));if(!m)break;
  const need=fmtNeed(fmtOf(t,m).bo);const aOut=out.includes(m.a);m.wo=true;WO_IN=true;try{applyResult(t.id,m.id,aOut?m.b:m.a,aOut?0:need,aOut?need:0);}finally{WO_IN=false;}again=true;}}

function tourOutDlg(tid){const t=S.tournaments.find(x=>x.id===tid);if(!t)return;const out=t.out||[];
 modal(`<h3>👤 Spieler streichen</h3><p class="muted small" style="margin-top:0">Wer gestrichen wird, spielt nicht mehr mit: Alle seine noch offenen und künftigen Spiele gewinnt der Gegner kampflos. Bereits gespielte Ergebnisse bleiben stehen.</p>

function tourOut(tid,id,on){const t=S.tournaments.find(x=>x.id===tid);if(!t)return;
 const doIt=()=>{t.out=(t.out||[]).filter(x=>x!==id);if(on)t.out.push(id);if(on){t.matches.forEach(m=>{if(playable(m)&&(m.a===id||m.b===id))m.board=null;});woSweep(t);}assignAll();save();tourOutDlg(tid);render();toast(on?`${U(id).nick} ist gestrichen`:`${U(id).nick} spielt wieder mit (nur künftige Spiele)`);};
 if(on)ask(`${U(id).nick} wirklich aus dem Turnier streichen? Alle offenen Spiele von ${U(id).nick} werden kampflos für den Gegner gewertet.`,'Streichen',doIt,true);else doIt();}
function doManual(tid,mid){const t=S.tournaments.find(x=>x.id===tid),m=t.matches.find(x=>x.id===mid);const f=fmtOf(t,m);const need=fmtNeed(f.bo);
 const a=+document.getElementById('ra').value,b=+document.getElementById('rb').value;

 applyResult(tid,mid,draw?'DRAW':(a>b?m.a:m.b),a,b);save();closeModal();render();}
