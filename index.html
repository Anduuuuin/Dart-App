function demoData(){const names=[['Pfeilblitz','⚡'],['Triple-Tom','🐯'],['Bullseye-Bella','🦊'],['Lucky Leo','🍀'],['Doppel-Dani','🐼'],['Haumichtot','🔥']];
 const ids=names.map(([n,a])=>{let u=S.users.find(x=>x.nick===n);if(!u){u={id:uid(),nick:n,role:'player',avatar:a,pin:'1234',created:Date.now()};S.users.push(u);}return u.id;});
 const skill={};ids.forEach((id,i)=>skill[id]=28+i*5+Math.random()*6);
 for(let d=40;d>=1;d--){const day=Date.now()-d*DAY;const prog=(40-d)/40;
  ids.forEach(id=>{if(Math.random()<.35){const base=skill[id]+prog*8;const r=Math.random();
   if(r<.4)S.trainings.push({id:uid(),uid:id,date:day+Math.random()*3e7,mode:'atc',darts:Math.round(Math.max(24,95-base*.9-prog*15+Math.random()*12))});
   else if(r<.7)S.trainings.push({id:uid(),uid:id,date:day+Math.random()*3e7,mode:'bob',score:Math.round(Math.max(0,base*3-80+prog*90+Math.random()*60))});
   else S.trainings.push({id:uid(),uid:id,date:day+Math.random()*3e7,mode:'score',avg:Math.max(10,base+Math.random()*8-4)});}});
  if(Math.random()<.5){const [a,b]=shuffle(ids.slice()).slice(0,2);const mk=id=>{const avg=Math.max(15,skill[id]+prog*8+Math.random()*10-5);const darts=45+Math.round(Math.random()*30);
    const o={id,darts,pts:Math.round(avg*darts/3),s180:Math.random()<avg/400?1:0,s140:Math.round(Math.random()*avg/30),s100:Math.round(Math.random()*avg/12),hiCo:Math.round(20+Math.random()*avg*1.4),legs:0,won:false};const nl=2+Math.round(Math.random());[9,12,15,18].forEach(N=>{o['f'+N]=Math.round((avg+6-N/3+Math.random()*6)*N/3*nl);o['f'+N+'n']=nl;});o.hf=o.hiCo>=100?[o.hiCo]:[];o.co=nl-1;o.dd=o.co+Math.round(Math.random()*8+2);return o;};
   const pa=mk(a),pb=mk(b);(pa.pts/pa.darts>pb.pts/pb.darts?pa:pb).won=true;pa.legs=pa.won?2:Math.round(Math.random());pb.legs=pb.won?2:Math.round(Math.random());
   S.games.push({id:uid(),date:day+4e7,start:501,bestOf:3,tid:null,players:[pa,pb]});}}
 return ids;}

 lg.matches.filter(m=>m.r<2).forEach(m=>{const w=Math.random()<.5;applyResult(lg.id,m.id,w?m.a:m.b,w?2:Math.floor(Math.random()*2),w?Math.floor(Math.random()*2):2);});lg.created-=DAY;
 const t1=makeTour({...base,name:'Vereinsmeisterschaft',kind:'turnier',mode:'groups',players:ids,boards:[1,2]});play(t1,4);
 const t2=makeTour({...base,name:'Kids-Training',mode:'swiss',start:301,fmt:{sets:false,bo:1,setLegs:3},dOut:false,swissRounds:3,players:kids,boards:[3]});play(t2,2);
 
 [...ids,...kids].forEach((pid,pi)=>{const lv=pi/10;for(let d=24;d>=1;d-=3){const pr=(24-d)/24;
  const add=(ex,val,extra={})=>S.trainings.push({id:uid(),uid:pid,date:Date.now()-d*DAY+pi*1e5,mode:'ex',ex,val,complete:true,...extra});
  if(Math.random()<.6)add('d16',Math.round(Math.min(15,1+lv*3+pr*3+Math.random()*2)));
  if(Math.random()<.5)add('atcw',Math.round(Math.max(22,95-lv*30-pr*20+Math.random()*10)));
  if(Math.random()<.5){const t=Math.round(lv*4+pr*2+Math.random()*2),s2=Math.round(9+pr*3+Math.random()*3);add('skill',t+s2,{t,s:s2});}
  if(Math.random()<.4)add('fin2140',Math.round(Math.min(20,6+lv*6+pr*5+Math.random()*3)));}});
 const coach={id:uid(),nick:'Coach Kalle',role:'player',avatar:'🧢',captain:true,pin:'1234',created:Date.now()};S.users.push(coach);
 const tt=S.users.find(u=>u.id===ids[1]);tt.captain=true;
 S.teams.push({id:uid(),name:'Kids-Training',type:'training',captains:[coach.id],members:[...kids],code:joinCode(),created:Date.now()});
 S.teams.push({id:uid(),name:'1. Mannschaft',type:'team',captains:[tt.id],members:ids.slice(0,5),code:joinCode(),created:Date.now()});
 assignAll();save();setMe('club');go('boards');toast('Demo gestartet – du bist als Verein angemeldet');}
function demoBar(){if(!S.demo||!me()||view==='live')return'';const r=me().role;
 return `<div style="background:#f2c14e18;border-bottom:1px solid #f2c14e44"><div class="row demobar" style="max-width:1000px;margin:0 auto;padding:8px 16px;gap:8px"><b style="color:var(--gold)">🧪 Demo</b><span class="muted small lbl">Ansicht:</span>
 <button class="sm ${r==='admin'?'pri':''}" onclick="setMe('admin');go('tour')">Admin</button><button class="sm ${r==='club'?'pri':''}" onclick="setMe('club');go('boards')">Verein</button>
 <select class="sm" style="width:auto;padding:6px 8px" onchange="if(this.value){setMe(this.value);go('home')}"><option value="">Als Spieler…</option>${players().map(p=>`<option value="${p.id}" ${p.id===meId?'selected':''}>${esc(p.nick)}</option>`).join('')}</select>
 <span class="sp"></span><button class="sm ghost" onclick="ask('Demo beenden? Alle Demo-Daten werden gelöscht.','Beenden',()=>{const lg=S.settings.logo;S=fresh();if(lg)S.settings.logo=lg;save();setMe(null);go('login');},true)">Demo beenden</button></div></div>`;}
/* ===================== Render ===================== */
function render(){if(!S.settings.defaults)S.settings.defaults={start:501,fmt:{sets:false,bo:3,setLegs:3},dOut:true};if(!window.__defApplied){window.__defApplied=1;applyDefaults();}S.planCfg=S.planCfg||{};S.myPlans=S.myPlans||{};const m=me();if(!m&&view!=='login')view='login';
 if(m&&S.live&&view!=='live')view='live';
 if(m&&!S.live&&view==='live')view=m.role==='player'?'home':'tour';
 if(m&&view==='home'&&m.role!=='player')view='tour';
 if(m&&view==='admin'&&!isStaff())view='home';
 renderHeader();renderNav();const app=document.getElementById('app');let h='';
 switch(view){case'login':h=vLogin();break;case'home':h=vHome();break;case'stats':h=vStats(meId);break;case'player':h=canSee(param)?vStats(param):vHome();break;case'teams':h=(isStaff()||me().captain)?vTeams():vHome();break;case'team':h=vTeam(param);break;
  case'people':h=isStaff()?vPeople():vHome();break;case'play':trTab='play';view='train';h=vTrain();break;case'train':h=vTrain();break;
  case'tour':h=isStaff()?vTour():vHome();break;case'boards':h=isStaff()?vBoards():vTour();break;case'board':h=isStaff()?vBoard(param):vTour();break;case'tournew':h=isStaff()?vTourNew():vTour();break;case'tourview':h=isStaff()?vTourView(param)||'':vHome();break;case'admin':h=vAdmin();break;
  case'ex':h=vExDetail(param);break;case'mg':h=vMGDetail(param);break;case'planrun':h=vPlanRun();break;
  case'live':h=S.live.kind==='mg'?vMG():S.live.kind==='ex'?vEx():S.live.kind==='x01'?vX01():S.live.kind==='atc'?vATC():S.live.kind==='bob'?vBob():vScore();break;}
 app.innerHTML=h+(view!=='live'?`<div class="proto">Prototyp · Daten werden nur auf diesem Gerät gespeichert</div>`:'');}
document.addEventListener('keydown',e=>{if(view!=='live'||!S.live||document.getElementById('modal').classList.contains('show'))return;
 if(!('input' in S.live))return;if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Enter')key('ok');else if(e.key==='Backspace')key('del');});
render();
