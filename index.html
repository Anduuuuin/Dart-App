<style>
:root{
  --bg:#0f1214;--panel:#181d21;--panel2:#20272c;--line:#2c353b;
  --text:#eef2f4;--muted:#93a1aa;--accent:#2fbf71;--accent2:#e5484d;--gold:#f2c14e;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;background:var(--panel2);padding:12px 16px;transition:transform .05s,background .15s}
button:active{transform:scale(.97)}
button.pri{background:var(--accent);color:#06210f;font-weight:700}
button.red{background:var(--accent2);color:#fff;font-weight:700}
button.ghost{background:transparent;border:1px solid var(--line)}
button.sm{padding:7px 11px;font-size:14px;border-radius:9px}
button:disabled{opacity:.35;pointer-events:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
label{display:block;color:var(--muted);font-size:14px;margin:12px 0 6px}
h1,h2,h3{margin:0 0 12px;line-height:1.2}
h2{font-size:22px}h3{font-size:17px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{position:sticky;top:0;z-index:5;background:rgba(15,18,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;max-width:1000px;margin:0 auto;padding:10px 16px}
.logo{font-weight:800;font-size:19px;letter-spacing:.3px}
.logo span{color:var(--accent)}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1000px;margin:0 auto;padding:0 16px 10px}
nav button{white-space:nowrap;padding:9px 14px;background:transparent;border:1px solid var(--line)}
nav button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.tile .ic{font-size:28px}
.tile b{font-size:16px}.tile small{color:var(--muted)}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;background:var(--panel);border:1px solid var(--line)}
.av{font-size:34px;line-height:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}
.badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.badge.g{color:var(--accent);border-color:#2fbf7155}.badge.y{color:var(--gold);border-color:#f2c14e55}.badge.r{color:#ff8b8e;border-color:#e5484d55}
.stat{background:var(--panel2);border-radius:12px;padding:12px}
.stat .v{font-size:24px;font-weight:800}.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border-radius:10px;border:1px solid transparent;cursor:pointer;user-select:none}
.chk.on{border-color:var(--accent);background:#2fbf7118}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:9px 14px}
.chips button.on{background:var(--accent);color:#06210f;font-weight:700}
/* scorer */
.sc-players{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:12px}
.sc-p{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative}
.sc-p.cur{border-color:var(--accent);box-shadow:0 0 0 3px #2fbf7122}
.sc-p .nm{font-weight:700;display:flex;gap:6px;align-items:center}
.sc-p .rem{font-size:56px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.sc-p .meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.sc-p .legs{position:absolute;top:10px;right:12px;font-weight:800;color:var(--gold)}
.co{color:var(--gold);font-weight:700;font-size:14px;min-height:20px}
.inbox{font-size:44px;font-weight:800;text-align:center;background:var(--panel2);border-radius:12px;padding:6px;min-height:68px;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pad button{font-size:26px;font-weight:700;padding:16px 0}
.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.quick button{padding:10px 0;font-weight:700;font-size:15px}
.big-target{font-size:84px;font-weight:900;text-align:center;line-height:1}
.bracket{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.round{min-width:210px;display:flex;flex-direction:column;gap:10px;justify-content:space-around}
.match{background:var(--panel2);border-radius:12px;padding:8px 10px;border:1px solid var(--line)}
.match .pl{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.match .pl.w{color:var(--accent);font-weight:700}
.match .pl.l{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;transition:transform .25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.show{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.avpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.avpick button{font-size:26px;padding:8px 0}
.avpick button.on{background:var(--accent)}
.banner{background:linear-gradient(135deg,#f2c14e22,#2fbf7118);border:1px solid #f2c14e55;border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
svg text{fill:var(--muted);font-size:18px}

<div id="toast"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<script>
/* ===================== Daten ===================== */
const KEY='dartclub_v2';
const AVATARS=['🎯','🦊','🐯','🐻','🦁','🐸','🐼','🚀','⚡','🔥','👑','🐲','🦅','🐺','🌟','🍀','🐬','🤖'];
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
function fresh(){return{users:[
  {id:'admin',nick:'Admin',role:'admin',pin:'0000',avatar:'🛡️'},
  {id:'club',nick:'Vereinszugang',role:'club',pin:'1111',avatar:'🏠'}],
  tournaments:[],games:[],trainings:[],live:null,settings:{boards:4},teams:[]};}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||fresh();}catch(e){S=fresh();}
S.settings=S.settings||{boards:4};S.teams=S.teams||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let meId=null;try{meId=sessionStorage.getItem(KEY+'_me');}catch(e){}
const me=()=>S.users.find(u=>u.id===meId)||null;
function setMe(id){meId=id;try{id?sessionStorage.setItem(KEY+'_me',id):sessionStorage.removeItem(KEY+'_me');}catch(e){}}
const U=id=>{if(typeof id==='string'&&id.startsWith('g:'))return{id,nick:id.slice(2),guest:true};return S.users.find(u=>u.id===id)||{nick:'Gelöscht',gone:true};};
const isGuest=id=>typeof id==='string'&&id.startsWith('g:');
function AV(u,sz){u=u||{};const z=sz?`width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.4)}px;`:'';
 if(u.photo)return `<img class="avi" style="${z}" src="${u.photo}" alt="">`;
 const ini=(u.nick||'?').split(/[\s\-_.]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';
 const pal=['#1fb35a','#e3262f','#2a7f62','#b8323a','#3e9b5b','#7a2a33','#20523b','#8c5a1f'];let h=0;for(const ch of (u.nick||''))h=(h*31+ch.charCodeAt(0))>>>0;
 const bg=u.guest?'#2a302e':u.role==='admin'||u.role==='club'?'#0b0e0d':pal[h%pal.length];
 return `<span class="avi" style="${z}background:${bg}">${u.role==='club'?'🏟':u.role==='admin'?'⚙':ini}</span>`;}
const players=()=>S.users.filter(u=>u.role==='player').sort((a,b)=>a.nick.localeCompare(b.nick));
const isStaff=()=>me()&&(me().role==='admin'||me().role==='club');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=x=>(isFinite(x)?x:0).toFixed(1);
const dstr=t=>new Date(t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
const DAY=864e5;

/* ===================== UI-Helfer ===================== */
let view='home',param=null;
function go(v,p=null){view=v;param=p;render();window.scrollTo(0,0);}
let toastT;function toast(m,ms=2200){const t=document.getElementById('toast');t.innerHTML=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms);}
function modal(html){document.getElementById('mbox').innerHTML=html;document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function ask(text,yesLabel,fn,danger){modal(`<h3>${text}</h3><div class="row" style="margin-top:16px"><button class="ghost sp" onclick="closeModal()">Abbrechen</button><button class="${danger?'red':'pri'} sp" id="askyes">${yesLabel}</button></div>`);document.getElementById('askyes').onclick=()=>{closeModal();fn();};}

/* ===================== Checkout-Tabelle ===================== */
const CO={};(function(){const seg=[],dbl=[];for(let n=20;n>=1;n--)seg.push(['T'+n,3*n]);seg.push(['Bull',50],['25',25]);for(let n=20;n>=1;n--)seg.push([String(n),n]);
for(let n=20;n>=1;n--)dbl.push(['D'+n,2*n]);dbl.push(['Bull',50]);
const dR={D20:0,D16:0,D8:1,D18:1,D12:1,D10:1,D4:2,D14:2,D2:3,D6:3,Bull:6};const sC=a=>{const m=/^T(\d+)$/.exec(a);if(m){const n=+m[1];return n>=15?20-n:8;}return a==='Bull'?6:a==='25'?3:2;};
const cost={};const put=(v,r,c)=>{if(v>170)return;if(cost[v]==null||c<cost[v]){cost[v]=c;CO[v]=r;}};
dbl.forEach(d=>put(d[1],[d[0]],100+(dR[d[0]]??4)*3));
seg.forEach(a=>dbl.forEach(d=>put(a[1]+d[1],[a[0],d[0]],200+(dR[d[0]]??4)*3+sC(a[0]))));
seg.forEach(a=>seg.forEach(b=>dbl.forEach(d=>put(a[1]+b[1]+d[1],[a[0],b[0],d[0]],300+(dR[d[0]]??4)*3+sC(a[0])+sC(b[0])+(sC(a[0])>sC(b[0])?1:0)))));})();

 c.getContext('2d').drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,z,z);cb(c.toDataURL('image/jpeg',.82));};im.src=r.result;};r.readAsDataURL(file);}

/* ===================== Statistik-Berechnung ===================== */
function gamesOf(id){return S.games.filter(g=>g.players.some(p=>p.id===id)).sort((a,b)=>a.date-b.date);}
function trainsOf(id,mode){return S.trainings.filter(t=>t.uid===id&&(!mode||t.mode===mode)).sort((a,b)=>a.date-b.date);}
function calc(id){const gs=gamesOf(id);let darts=0,pts=0,s180=0,s140=0,s100=0,hiCo=0,wins=0;const avgs=[];
 const fN={9:[0,0],12:[0,0],15:[0,0],18:[0,0]};let dd=0,cos=0;const hf=[];const m30=[0,0,0];
 gs.forEach(g=>{const p=g.players.find(x=>x.id===id);[9,12,15,18].forEach(N=>{fN[N][0]+=p['f'+N]||0;fN[N][1]+=p['f'+N+'n']||0;});(p.hf||[]).forEach(v=>hf.push(v));dd+=p.dd||0;cos+=p.co||0;if(g.date>Date.now()-30*DAY){m30[0]+=p.darts;m30[1]+=p.pts;m30[2]++;}darts+=p.darts;pts+=p.pts;s180+=p.s180;s140+=p.s140;s100+=p.s100;hiCo=Math.max(hiCo,p.hiCo||0);if(p.won)wins++;avgs.push({d:g.date,v:p.darts?p.pts/p.darts*3:0});});
 const tr=trainsOf(id);const acts=[...gs.map(g=>g.date),...tr.map(t=>t.date)];
 const days=new Set(acts.filter(t=>t>Date.now()-30*DAY).map(t=>new Date(t).toDateString())).size;
 const week=acts.filter(t=>t>Date.now()-7*DAY).length;
 const last=acts.length?Math.max(...acts):0;
 const atc=trainsOf(id,'atc'),bob=trainsOf(id,'bob'),scr=trainsOf(id,'score');
 const l5=avgs.slice(-5),p5=avgs.slice(-10,-5);const mean=a=>a.reduce((s,x)=>s+x.v,0)/(a.length||1);
 const trend=l5.length&&p5.length?mean(l5)-mean(p5):null;
 const fAvg=N=>fN[N][1]?fN[N][0]/fN[N][1]/N*3:null;const l10=avgs.slice(-10);
 return{dd,cos,coPct:dd?cos/dd*100:null,fAvg,fLegs:N=>fN[N][1],hf:hf.sort((a,b)=>b-a),avg30:m30[0]?m30[1]/m30[0]*3:null,games30:m30[2],last10n:l10.length,games:gs.length,wins,avg:darts?pts/darts*3:0,best:avgs.length?Math.max(...avgs.map(a=>a.v)):0,s180,s140,s100,hiCo,avgs,
  trainings:tr.length,days,week,last,trend,atc,bob,scr,
  atcBest:atc.length?Math.min(...atc.map(t=>t.darts)):null,bobBest:bob.length?Math.max(...bob.map(t=>t.score)):null,scrBest:scr.length?Math.max(...scr.map(t=>t.avg)):null,
  recentAvg:mean(avgs.slice(-10))};}

function chart(points,{title,unit='',lowerBetter=false}={}){
 if(points.length<2)return `<div class="stat"><div class="k">${title}</div><p class="muted small">Noch zu wenig Daten – ab 2 Einträgen gibt's hier eine Kurve.</p></div>`;
 const W=600,H=200,P=44;const vs=points.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<1){mx+=1;mn-=1;}
 const x=i=>P+i*(W-P-10)/(points.length-1),y=v=>H-P+5-(v-mn)/(mx-mn)*(H-P-15);
 const d=points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
 const first=vs[0],lastv=vs[vs.length-1];const better=lowerBetter?lastv<first:lastv>first;
 const col=better?'var(--accent)':'var(--gold)';
 return `<div class="stat"><div class="row"><div class="k sp">${title}</div><span class="badge ${better?'g':'y'}">${better?'▲ besser geworden':'● dranbleiben'}</span></div>
 <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:6px">
 <line x1="${P}" x2="${W-10}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--line)"/><line x1="${P}" x2="${W-10}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)"/>
 <text x="2" y="${y(mx)+4}">${Math.round(mx)}</text><text x="2" y="${y(mn)+4}">${Math.round(mn)}</text>
 <path d="${d}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
 ${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="${col}"><title>${dstr(p.d)}: ${f1(p.v)}${unit}</title></circle>`).join('')}
 <text x="${P}" y="${H-4}">${dstr(points[0].d)}</text><text x="${W-10}" y="${H-4}" text-anchor="end">${dstr(points[points.length-1].d)}</text></svg></div>`;}

 const cells=[];for(let i=days-1;i>=0;i--){const d=new Date(Date.now()-i*DAY);const c=cnt[d.toDateString()]||0;cells.push(`<i class="${c>=4?'l3':c>=2?'l2':c?'l1':''}" title="${d.toLocaleDateString('de-DE')}: ${c} Einheiten"></i>`);}
 return `<div class="heat">${cells.join('')}</div><div class="row muted small" style="margin-top:6px"><span>vor 4 Wochen</span><span class="sp"></span><span>heute</span></div>`;}

function startX01(ps,start,fmt,dOut,tref){if(typeof fmt==='number')fmt={sets:false,bo:fmt,setLegs:3};

function vX01(){const L=S.live;const f=L.fmt;
 const cur=L.scores[L.cur];const co=L.dOut&&CO[cur]?CO[cur].join(' · '):(!L.dOut&&cur<=60?'Check-out möglich':'');

 <div class="sc-players">${L.players.map((id,i)=>{const s=L.st[i];return `<div class="sc-p ${i===L.cur?'cur':''}">${showScore?`<span class="legs">${f.sets?`Sets ${L.sets[i]} · Legs ${L.legs[i]}`:`Legs ${L.legs[i]}`}</span>`:''}
  <div class="nm">${AV(U(id))} ${esc(U(id).nick)}</div><div class="rem">${L.scores[i]}</div>
  <div class="meta"><span>Ø ${f1(s.darts?s.pts/s.darts*3:0)}</span><span>Letzte: ${s.last??'–'}</span><span>Darts: ${s.darts}</span></div>
  ${i===L.cur?`<div class="co">${co}</div>`:''}</div>`;}).join('')}</div>
 <div class="card"><div class="inbox">${L.input||'<span class="muted" style="font-size:22px">Punkte der Aufnahme</span>'}</div>
 <div class="quick">${[26,41,45,60,81,85,100,121,140,180,0].map(v=>`<button onclick="visit(${v})">${v}</button>`).join('')}<button onclick="visit(${cur})" title="Rest checken" style="color:var(--gold)">✓ Rest</button></div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}
 <button onclick="undo()" style="font-size:16px">↶ Rückgängig</button><button onclick="key('0')">0</button><button class="pri" onclick="key('ok')">OK</button></div></div>`;}
function key(k){const L=S.live;if(!L)return;
 if(k==='ok'){if(L.input==='')return;const v=parseInt(L.input,10);L.input='';if(L.kind==='score')scoreVisit(v);else if(L.kind==='mg')mgVisit(v);else if(L.kind==='ex')exNum(v);else visit(v);return;}
 if(k==='del'){L.input=L.input.slice(0,-1);render();return;}
 if(L.input.length>=3)return;L.input=(L.input+k).replace(/^0+(?=\d)/,'');render();}
function visit(v){const L=S.live;L.input='';
 if(v>180||IMPOSSIBLE.includes(v)){toast(`${v} ist nicht möglich`);render();return;}
 const i=L.cur,prev=L.scores[i],rest=prev-v,s=L.st[i];
 let bust=rest<0||(L.dOut&&rest===1);
 if(rest===0&&L.dOut&&!CO[prev])bust=true;
 if(rest===0&&!bust){const minD=L.dOut?CO[prev].length:1;
  modal(`<h3>Check-out ${prev}! 🎯</h3><p class="muted">Mit wie vielen Darts?</p><div class="row">${[1,2,3].map(d=>`<button class="pri sp" ${d<minD?'disabled':''} onclick="closeModal();coDarts(${prev},${d})">${d}</button>`).join('')}</div><button class="ghost" style="width:100%;margin-top:10px" onclick="closeModal();render()">Abbrechen</button>`);return;}
 L.hist.push({i,prev,s:{...s,hf:[...(s.hf||[])]}});
 firstN(s,3,bust?0:v);s.darts+=3;if(bust){s.last='Bust';toast('Überworfen! 💥');}else{L.scores[i]=rest;s.pts+=v;s.last=v;if(v===180){s.s180++;toast('🔥 ONE HUNDRED AND EIGHTY! 🔥');}else if(v>=140)s.s140++;else if(v>=100)s.s100++;}
 L.cur=(i+1)%L.players.length;save();render();
 if(L.dOut&&CO[prev]&&(prev<=50||CO[prev].length<=2||(!bust&&rest<=50)))askDD(i,bust);}
/* Checkout-Quote: Darts aufs Doppel abfragen */
const ddBtns=(fn,from,to)=>`<div class="row">${Array.from({length:to-from+1},(_,k)=>from+k).map(n=>`<button class="${n?'pri':'ghost'} sp" style="padding:18px 0;font-size:22px" onclick="closeModal();${fn}(${n})">${n}</button>`).join('')}</div>`;

function setDD(n){const L=S.live;if(!L||L.kind!=='x01')return;const s=L.st[ddIdx];s.dd=(s.dd||0)+n;save();}

function coDarts(prev,d){if(d===1)return finishLeg(prev,1,1);coPend=[prev,d];

function undo(){const L=S.live;if(L.input){L.input='';render();return;}const h=L.hist.pop();if(!h)return toast('Nichts zum Rückgängigmachen in diesem Leg');

/* Ergebnis entscheiden: wer zuerst die nötige Anzahl hat – sonst nach allen Legs/Sets: Höchster gewinnt, Gleichstand = Unentschieden */
/* First 9/12/15/18: Punkte der ersten N Darts je Leg sammeln */
function firstN(s,d,v){const a=s.ld||0;s.ld=a+d;s.lp=(s.lp||0)+v;[9,12,15,18].forEach(N=>{if(a<N&&s.ld>=N){s['f'+N]=(s['f'+N]||0)+s.lp;s['f'+N+'n']=(s['f'+N+'n']||0)+1;}});}
function decide(arr,bo){const need=fmtNeed(bo);const w=arr.findIndex(x=>x>=need);if(w>=0)return{done:true,w};
 const tot=arr.reduce((a,b)=>a+b,0);if(tot<bo)return{done:false};const mx=Math.max(...arr);const top=arr.map((x,i)=>x===mx?i:-1).filter(i=>i>=0);
 return{done:true,w:top.length===1?top[0]:null};}
function finishLeg(v,d,dd=1){const L=S.live;const i=L.cur,s=L.st[i];const f=L.fmt;if(L.dOut){s.dd=(s.dd||0)+dd;s.co=(s.co||0)+1;}
 firstN(s,d,v);s.darts+=d;s.pts+=v;s.last=v;s.hiCo=Math.max(s.hiCo,v);if(v>=100){s.hf=s.hf||[];s.hf.push(v);}if(v>=140)s.s140++;else if(v>=100)s.s100++;
 L.legs[i]++;L.legsTotal[i]++;let msg=`Leg für ${esc(U(L.players[i]).nick)}!`;
 if(f.sets){if(L.legs[i]>=fmtNeed(f.setLegs)){L.sets[i]++;L.legs=L.players.map(()=>0);msg=`🎯 Set für ${esc(U(L.players[i]).nick)}!`;
   const r=decide(L.sets,f.bo);if(r.done)return endX01(r.w);}}
 else{const r=decide(L.legs,f.bo);if(r.done)return endX01(r.w);}
 toast(msg);
 L.st.forEach(x=>{x.ld=0;x.lp=0;});L.scores=L.players.map(()=>L.start);L.legStarter=(L.legStarter+1)%L.players.length;L.cur=L.legStarter;L.hist=[];save();render();}
function endX01(wi){const L=S.live;const draw=wi===null;const f=L.fmt;const before={};L.players.forEach(id=>before[id]=calc(id).best);

let trTab='play',exUser=null,openPlan='checkout';
function trUid(){return me().role==='player'?meId:exUser;}
function exRuns(uid,id){return S.trainings.filter(x=>x.uid===uid&&x.mode==='ex'&&x.ex===id).sort((a,b)=>a.date-b.date);}
function exBest(uid,id){const t=exRuns(uid,id).filter(x=>x.complete!==false);if(!t.length)return null;const v=t.map(x=>x.val);return EX[id].better==='low'?Math.min(...v):Math.max(...v);}
function exFmt(id,v,x){if(v==null)return'–';if(x&&x.complete===false)return'nicht beendet';return `${v}${EX[id].max?' / '+EX[id].max:''} ${EX[id].unit}`;}

/* --- Trainingsbereich mit Reitern --- */
function vTrain(){const self=me().role==='player';
 if(!['play','games','mg','ex','plans'].includes(trTab))trTab='play';
 const tabsH=`<div class="ph"><h1>Training</h1><p>${{play:'X01 frei gespielt – von 170 bis 1001',mg:'Sport-, Party- und Taktikspiele für 1–8 Spieler',games:'Spielerische Trainingsmodi, auch mit mehreren Spielern',ex:'Gezielte Übungen mit Anleitung und Rekorden',plans:'Mehrere Übungen am Stück mit Stoppuhr'}[trTab]}</p></div><div class="seg">${[['play','🎯 Spielen'],['games','🕐 Spiele'],['mg','🎲 Minispiele'],['ex','📋 Übungen'],['plans','🗂️ Pläne']].map(([k,l])=>`<button class="${trTab===k?'on':''}" onclick="trTab='${k}';render()">${l}</button>`).join('')}</div>`;
 const run=S.planRun?`<div class="banner"><div class="row"><span class="sp">▶ Laufender Plan: <b>${esc(S.planRun.name)}</b> (${esc(U(S.planRun.uid).nick)})</span><button class="sm pri" onclick="go('planrun')">Fortsetzen</button></div></div>`:'';
 if(trTab==='games')return `${tabsH}${run}${vTrainGames()}`;if(trTab==='play')return `${tabsH}${run}${vPlay()}`;if(trTab==='mg')return `${tabsH}${run}${vMGList()}`;
 const pick=!self?`<div class="card"><label style="margin-top:0">Wer trainiert?</label><div class="slots"><div class="slot ${exUser?'':'guest'}" onclick="openPicker({title:'Wer trainiert?',exclude:[],onPick:id=>{exUser=id;}})">${AV(exUser?U(exUser):{nick:'?',guest:true},40)}<div class="who"><b>${exUser?esc(U(exUser).nick):'Profil wählen'}</b><small>${exUser?'antippen zum Wechseln':'Übungen werden im Profil gespeichert'}</small></div></div></div></div>`:'';
 return `${tabsH}${run}${pick}${trTab==='ex'?vExList():vPlans()}`;}
let exCat='all';
function vExList(){const uid=trUid();const all=Object.entries(EX);
 return `<div class="seg">${[['all','Alle ('+all.length+')'],...Object.entries(EXCAT).map(([k,l])=>[k,l+' ('+all.filter(([,e])=>e.cat===k).length+')'])].map(([k,l])=>`<button class="${exCat===k?'on':''}" onclick="exCat='${k}';render()">${l}</button>`).join('')}</div><div class="grid2">${all.filter(([,e])=>exCat==='all'||e.cat===exCat).map(([id,e])=>{const b=uid?exBest(uid,id):null;return `<button class="tile" onclick="go('ex','${id}')">
 <div class="row" style="width:100%"><b class="sp">${e.name}</b><span class="badge">⏱ ${e.dur} Min.</span></div><small>${e.desc}</small>
 ${uid?`<small>Rekord: <b style="color:${b!=null?'var(--gold)':'var(--muted)'}">${b!=null?exFmt(id,b):'noch keiner'}</b> · ${exRuns(uid,id).length}× gemacht</small>`:''}</button>`;}).join('')}</div>`;}

/* --- Detailseite --- */
function vExDetail(id){const e=EX[id];if(!e){view='train';return vTrain();}const uid=trUid();const runs=uid?exRuns(uid,id):[];const b=uid?exBest(uid,id):null;const last=runs[runs.length-1];
 return `<button class="sm ghost" onclick="go('train')" style="margin-bottom:12px">← Übungen</button>
 <h1 style="font-size:32px;margin-bottom:8px">${e.name}</h1><p class="muted" style="font-size:17px;margin-top:0">${e.desc}</p>
 <div class="stats" style="margin:16px 0"><div class="stat"><div class="k">⏱ Dauer</div><div class="v">${e.dur} Min.</div></div><div class="stat"><div class="k">🔁 Sets</div><div class="v">${e.sets}</div></div>
 ${uid?`<div class="stat"><div class="k">⭐ Rekord</div><div class="v" style="font-size:20px">${b!=null?exFmt(id,b):'–'}</div></div><div class="stat"><div class="k">Zuletzt</div><div class="v" style="font-size:20px">${last?exFmt(id,last.val,last):'–'}</div></div>`:''}</div>
 <div class="card"><h3>Anleitung</h3>${e.steps.map((s,i)=>`<div class="row" style="flex-wrap:nowrap;align-items:flex-start;margin:10px 0"><span style="flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #2fbf7188;background:#2fbf7118;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px">${i+1}</span><span style="padding-top:4px">${s}</span></div>`).join('')}</div>
 ${runs.length>=2?chart(runs.filter(r=>r.complete!==false).slice(-20).map(r=>({d:r.date,v:r.val})),{title:'Verlauf – '+e.unit,lowerBetter:e.better==='low'}):''}
 ${uid?`<button class="pri" style="width:100%;padding:18px;font-size:19px;margin-top:14px" onclick="startEx('${id}')">▶ Übung starten</button>
 <button class="ghost" style="width:100%;margin-top:8px;color:var(--accent)" onclick="manualEx('${id}')">Ergebnis manuell eingeben</button>`:`<p class="muted">Wähle zuerst unter „Übungen“ aus, wer trainiert.</p>`}`;}

function startEx(id,planIdx=null){const e=EX[id];const uid=planIdx!=null?S.planRun.uid:trUid();if(!uid)return toast('Erst Spieler wählen');
 const st={targets:{i:0,hits:0},hits:{v:0,hits:0},skill:{v:0,t:0,s:0,selT:null,selS:null},total:{sum:0,visits:[]},sprint:{rem:e.start,darts:0,visits:0},atc:{t:1,darts:0,dv:0},finlist:{n:e.from,ok:0},ladder:{n:e.from,rem:e.from,visits:0},streak:{n:e.from,rem:e.from,v:0,ok:0},tlist:{i:0,sum:0},visits:{v:0,sum:0,last:[]},catch:{i:0,v:0,rem:e.list?e.list[0]:0,pts:0,ok:0,darts:0},cogame:{cur:e.start,safe:e.start,rem:e.start,v:0,r:1,best:0,ok:0,log:[]},bull:{v:0,t:0,s:0,selT:null,selS:null}}[e.type];
 S.live={kind:'ex',ex:id,uid,st:JSON.parse(JSON.stringify(st)),hist:[],input:'',planIdx};save();go('live');}
function exSnap(){const L=S.live;L.hist.push(JSON.stringify(L.st));if(L.hist.length>80)L.hist.shift();}
function exUndo(){const L=S.live;if(L.input){L.input='';render();return;}const h=L.hist.pop();if(!h)return toast('Nichts zum Rückgängigmachen');L.st=JSON.parse(h);save();render();}
function padH(){return `<div class="inbox">${S.live.input||'<span class="muted" style="font-size:22px">Punkte der Aufnahme</span>'}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}<button onclick="exUndo()" style="font-size:16px">↶ Rückgängig</button><button onclick="key('0')">0</button><button class="pri" onclick="key('ok')">OK</button></div>`;}
const bigBtns=(fn,labels)=>`<div class="row">${labels.map(([v,l,c])=>`<button class="${c||'pri'} sp" style="padding:22px 0;font-size:22px" onclick="${fn}(${v})">${l}</button>`).join('')}</div>`;
const undoBtn=()=>`<button class="ghost sm" style="margin-top:12px" onclick="exUndo()">↶ Rückgängig</button>`;
const prog=(a,b)=>`<div style="height:10px;background:var(--panel2);border-radius:99px;margin:12px 0;overflow:hidden"><div style="height:100%;width:${Math.min(100,a/b*100)}%;background:var(--accent)"></div></div>`;

 const head=`<div class="muted" style="text-align:center">${AV(U(L.uid))} <b style="color:var(--text)">${esc(U(L.uid).nick)}</b> · ${e.name}${L.planIdx!=null?` · <span style="color:var(--gold)">${esc(S.planRun.name)}</span>`:''}</div>`;
 const big=(lab,sub)=>`<div class="muted" style="margin-top:14px;text-align:center">${sub}</div><div class="big-target">${lab}</div>`;

 <b class="sp" style="font-size:17px">${EX[it.ex].name}</b><div style="text-align:center"><div style="font-size:22px;font-weight:800">${it.done}/${it.sets}</div><div class="muted small">Sets</div></div></div>`).join('')}
 ${nextI>=0?`<button class="pri" style="width:100%;padding:18px;font-size:19px" onclick="startEx('${P.items[nextI].ex}',${nextI})">▶ ${P.items.some(i=>i.done)?'Weiter':'Training starten'}: ${EX[P.items[nextI].ex].name}${P.items[nextI].sets>1?` (Set ${P.items[nextI].done+1}/${P.items[nextI].sets})`:''}</button>
 <button class="ghost sm" style="margin-top:10px" onclick="ask('Plan abbrechen? Bereits gemachte Übungen bleiben gespeichert.','Abbrechen',()=>{S.planRun=null;save();go('train');},true)">Plan abbrechen</button>`
 :`<div class="banner"><h3 style="margin:0 0 6px">🏁 Plan geschafft!</h3>${P.items.reduce((a,i)=>a+i.sets,0)} Sets in ${fmtT(Date.now()-P.start)}.</div><button class="pri" style="width:100%;padding:16px" onclick="S.planRun=null;save();go('train')">Fertig</button>`}`;}
function fmtT(ms){const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
setInterval(()=>{const el=document.getElementById('ptimer');if(el&&S.planRun)el.textContent=fmtT(Date.now()-S.planRun.start);},1000);


function exStatsHTML(id){const rows=Object.keys(EX).map(e=>({e,r:exRuns(id,e)})).filter(x=>x.r.length);if(!rows.length)return'';
 return `<div class="card" style="overflow-x:auto"><h3>Trainingsübungen</h3><table><tr><th>Übung</th><th>Gemacht</th><th>Rekord</th><th>Zuletzt</th><th>Trend</th></tr>${rows.map(({e,r})=>{const c=r.filter(x=>x.complete!==false);const l=c.slice(-3),p=c.slice(-6,-3);const m=a=>a.reduce((s,x)=>s+x.val,0)/a.length;
  let tr='<span class="muted">–</span>';if(l.length&&p.length){const d=m(l)-m(p);const good=EX[e].better==='low'?d<0:d>0;tr=Math.abs(d)<0.01?'<span class="badge">=</span>':good?'<span class="badge g">▲ besser</span>':'<span class="badge r">▼</span>';}
  const last=r[r.length-1];return `<tr><td><b>${EX[e].name}</b></td><td>${r.length}×</td><td style="color:var(--gold)">${exFmt(e,exBest(id,e))}</td><td>${exFmt(e,last.val,last)}</td><td>${tr}</td></tr>`;}).join('')}</table></div>`;}
/* ===================== Minispiele ===================== */
const ORD=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const dName=d=>!d||d.n===0?'–':d.n===25?(d.m===2?'Bullseye':'Bull'):(d.m===3?'T':d.m===2?'D':'S')+d.n;
const byDesc=(st,f)=>st.p.map((x,i)=>i).sort((a,b)=>f(st.p[b])-f(st.p[a]));
const byAsc=(st,f)=>st.p.map((x,i)=>i).sort((a,b)=>f(st.p[a])-f(st.p[b]));
const hearts=n=>n>0?'❤️'.repeat(n):'💀 raus';
function shuffleNums(k,excl=[]){const a=[...Array(20).keys()].map(i=>i+1).filter(n=>!excl.includes(n));shuffle(a);return a.slice(0,k);}
function targetsGame(name,cat,desc,targets,start,rulesExtra){const lab=t=>t==='D'?'irgendein Doppel':t==='T'?'irgendein Triple':t==='B'?'Bull (25/50)':t==='DB'?'Bullseye (50)':String(t);
 const hit=(t,d)=>t==='D'?d.m===2&&d.n!==25:t==='T'?d.m===3:t==='B'?d.n===25:t==='DB'?d.n===25&&d.m===2:d.n===t;
 return{name,cat,min:1,max:8,dur:targets.length,desc,rounds:targets.length,
  rules:[`Ziele der Reihe nach: ${targets.map(lab).join(' → ')}.`,'Pro Runde 3 Darts aufs aktuelle Ziel – getroffene Punkte zählen.','Triffst du in einer Runde gar nicht, wird dein Punktestand halbiert!',...(rulesExtra||[]),'Wer am Ende die meisten Punkte hat, gewinnt.'],
  init(st){st.p.forEach(x=>x.s=start);},start(st,p){st.p[p].hit=false;},
  dart(st,p,d){const t=targets[st.round-1];if(hit(t,d)){st.p[p].s+=d.v;st.p[p].hit=true;}},
  endTurn(st,p){if(!st.p[p].hit){st.p[p].s=Math.floor(st.p[p].s/2);toast(`✂️ Halbiert: ${esc(U(st.ps[p]).nick)}`);}},
  status:(st,i)=>`${st.p[i].s} Punkte`,hint:(st)=>`Ziel: ${lab(targets[st.round-1])}`,result:st=>byDesc(st,x=>x.s)};}
function cricketGame(name,desc,nums){const sym=m=>['·','/','X','Ⓧ'][m];
 return{name,cat:'❌ Taktik',min:1,max:4,dur:20,desc,
  rules:[`Spielzahlen: ${nums.map(n=>n===25?'Bull':n).join(', ')}.`,'Jede Zahl muss 3× getroffen werden, um sie zu schließen (Doppel = 2, Triple = 3 Treffer, Bullseye = 2).','Ist eine Zahl bei dir zu, bei einem Gegner aber noch offen, bekommst du für weitere Treffer Punkte.','Gewonnen hat, wer alle Zahlen geschlossen hat und mindestens so viele Punkte hat wie jeder andere.'],
  init(st){st.p.forEach(x=>{x.s=0;x.mk={};nums.forEach(n=>x.mk[n]=0);});},
  dart(st,p,d){if(!nums.includes(d.n))return;const me=st.p[p];const before=me.mk[d.n];const tot=before+d.m;me.mk[d.n]=Math.min(3,tot);
   const extra=Math.max(0,tot-3);if(extra>0&&st.p.some((o,i)=>i!==p&&o.mk[d.n]<3))me.s+=extra*(d.n===25?25:d.n);
   if(nums.every(n=>me.mk[n]>=3)&&st.p.every((o,i)=>i===p||me.s>=o.s))st.winner=p;},
  status:(st,i)=>`<b style="color:var(--text)">${st.p[i].s} Punkte</b><div class="ckrow">${nums.map(n=>{const m=st.p[i].mk[n];return `<span class="ck m${m}">${n===25?'B':n}<i>${['','/','X','✓'][m]}</i></span>`;}).join('')}</div>`,
  hint:(st,p)=>{const open=nums.filter(n=>st.p[p].mk[n]<3);return open.length?`Offen: ${open.map(n=>n===25?'Bull':n).join(', ')}`:'Alles zu – sammle Punkte!';},
  result:st=>byDesc(st,x=>nums.filter(n=>x.mk[n]>=3).length*1000+x.s)};}
function killerGame(blind){return{name:blind?'Blind Killer':'Killer',cat:'💀 Gruppe',min:2,max:8,dur:15,
 desc:blind?'Wie Killer – aber die Zahlen der anderen sind geheim.':'Werde zum Killer und schalte die anderen über ihre Doppel aus.',
 rules:['Jeder bekommt eine eigene Zahl (1–20) und 3 Leben.','Triffst du das Doppel deiner Zahl, wirst du zum Killer 🔪.','Als Killer ziehst du mit dem Doppel einer fremden Zahl dem Besitzer ein Leben ab.','Triffst du als Killer dein eigenes Doppel, verlierst du selbst ein Leben.',...(blind?['Die Zahlen der anderen sind verdeckt – sie werden erst sichtbar, wenn jemand ein Leben verliert.']:[]),'Wer als Letzter übrig ist, gewinnt.'],
 init(st){const ns=shuffleNums(st.p.length);st.p.forEach((x,i)=>{x.num=ns[i];x.lives=3;x.k=false;x.rev=!blind;});},
 active:(st,i)=>st.p[i].lives>0,
 dart(st,p,d){if(d.m!==2||d.n===25)return;const me=st.p[p];const o=st.p.findIndex(x=>x.num===d.n&&x.lives>0);if(o<0)return;
  if(o===p){if(!me.k){me.k=true;toast('🔪 Du bist Killer!');}else{me.lives--;me.rev=true;toast('😬 Eigenes Doppel – Leben weg!');if(me.lives<=0)st.endTurn=true;}}
  else if(me.k){st.p[o].lives--;st.p[o].rev=true;toast(`🎯 ${esc(U(st.ps[o]).nick)} verliert ein Leben`);}},
 status:(st,i)=>`${st.p[i].rev?'Zahl '+st.p[i].num:'Zahl ?'} · ${hearts(st.p[i].lives)}${st.p[i].k?' 🔪':''}`,
 hint:(st,p)=>st.p[p].k?'Triff die Doppel der anderen!':`Werde Killer: Doppel ${st.p[p].num}`,result:st=>byDesc(st,x=>x.lives*10+(x.k?1:0))};}

const MG={
 football:{name:'Fußball',cat:'⚽ Sport',min:2,max:6,dur:10,desc:'Mit dem Bull holst du dir den Ball, jedes Doppel ist dann ein Tor.',
  rules:['Zuerst brauchst du den Ball: Triff das Bull (25 oder 50).','Solange du den Ball hast, ist jedes Doppel ein Tor ⚽.','Trifft ein Gegner das Bull, nimmt er dir den Ball ab.','Wer zuerst 5 Tore hat, gewinnt.'],
  init(st){st.ball=null;st.p.forEach(x=>x.g=0);},
  dart(st,p,d){if(d.n===25){if(st.ball!==p){st.ball=p;toast('⚽ Ballbesitz!');}}else if(st.ball===p&&d.m===2){st.p[p].g++;toast('⚽ TOOOR!');if(st.p[p].g>=5)st.winner=p;}},
  status:(st,i)=>`<b>${st.p[i].g}</b> Tore${st.ball===i?' ⚽':''}`,hint:(st,p)=>st.ball===p?'⚽ Du hast den Ball – schieß ein Tor: irgendein Doppel!':'Hol dir den Ball: Bull (25 oder 50)',result:st=>byDesc(st,x=>x.g)},
 baseball:{name:'Baseball',cat:'⚽ Sport',min:1,max:8,dur:12,rounds:9,desc:'9 Innings – in jedem Inning zählt nur eine Zahl.',
  rules:['Inning 1 wird auf die 1 geworfen, Inning 2 auf die 2 … bis Inning 9.','Single = 1 Run, Doppel = 2 Runs, Triple = 3 Runs.','Die meisten Runs nach 9 Innings gewinnen.'],
  init(st){st.p.forEach(x=>x.r=0);},dart(st,p,d){if(d.n===st.round)st.p[p].r+=d.m;},
  status:(st,i)=>`<b>${st.p[i].r}</b> Runs`,hint:st=>`Inning ${st.round}: Ziel ${st.round}`,result:st=>byDesc(st,x=>x.r)},
 golf:{name:'Golf',cat:'⚽ Sport',min:1,max:8,dur:12,rounds:9,desc:'9 Löcher – so wenige Schläge wie möglich.',
  rules:['Loch 1 wird auf die 1 gespielt, Loch 2 auf die 2 … bis Loch 9.','Dein bester Dart pro Loch zählt: Triple = 1 Schlag, Doppel = 2, Single = 3, daneben = 5.','Mit einem Triple ist das Loch sofort fertig.','Wer nach 9 Löchern die wenigsten Schläge hat, gewinnt.'],
  init(st){st.p.forEach(x=>{x.s=0;x.h=null;});},

  endTurn(st,p){st.p[p].s+=st.p[p].h??5;st.p[p].h=null;},
  status:(st,i)=>`<b>${st.p[i].s}</b> Schläge`,hint:st=>`Loch ${st.round}: Ziel ${st.round}`,result:st=>byAsc(st,x=>x.s)},
 snooker:{name:'Snooker',cat:'⚽ Sport',min:2,max:4,dur:15,desc:'Abwechselnd Rot und Farbe – wie am Snookertisch.',
  rules:['„Rote“ sind die Zahlen 1–15 (1 Punkt). Es gibt 15 Rote für alle zusammen.','Nach einer Roten musst du eine „Farbe“ treffen: 16=2, 17=3, 18=4, 19=5, 20=6, Bull=7 Punkte.','Wer das geforderte Ziel verfehlt, beendet seine Aufnahme.','Sind alle Roten weg, werden die Farben in Reihenfolge abgeräumt: 16, 17, 18, 19, 20, Bull.','Die meisten Punkte gewinnen.'],
  init(st){st.reds=15;st.fin=0;st.need='red';st.p.forEach(x=>x.s=0);},
  start(st){st.need=st.reds>0?'red':'final';},
  dart(st,p,d){const me=st.p[p];const FIN=[16,17,18,19,20,25];const cv=n=>n===25?7:n-14;
   if(st.need==='red'){if(d.n>=1&&d.n<=15){me.s+=1;st.reds--;st.need='color';}else st.endTurn=true;}
   else if(st.need==='color'){if(d.n>=16){me.s+=cv(d.n);st.need=st.reds>0?'red':'final';}else st.endTurn=true;}
   else{if(d.n===FIN[st.fin]){me.s+=cv(d.n);st.fin++;if(st.fin>=6)st.done=true;}else st.endTurn=true;}},
  status:(st,i)=>`<b>${st.p[i].s}</b> Punkte`,
  hint:st=>st.need==='red'?`Rote treffen (1–15) · noch ${st.reds} Rote`:st.need==='color'?'Farbe treffen: 16–20 oder Bull':`Abräumen: ${[16,17,18,19,20,'Bull'][st.fin]}`,result:st=>byDesc(st,x=>x.s)},
 grandnational:{name:'Grand National',cat:'⚽ Sport',min:1,max:8,dur:12,desc:'Pferderennen einmal rund ums Board – mit Hürden.',
  rules:['Ihr lauft einmal im Uhrzeigersinn ums Board: 20, 1, 18, 4, 13 …','Triff die nächste Zahl, um ein Feld weiterzukommen.','Jedes 5. Feld ist eine Hürde 🚧: dort brauchst du das Doppel.','Nach der Runde kommt das Ziel: Bull. Wer zuerst das Bull trifft, gewinnt.'],
  init(st){st.p.forEach(x=>x.pos=0);},
  dart(st,p,d){const me=st.p[p];if(me.pos<20){const fence=me.pos%5===4;if(d.n===ORD[me.pos]&&(!fence||d.m===2))me.pos++;}else if(d.n===25)st.winner=p;},
  status:(st,i)=>`🐎 ${Math.min(st.p[i].pos,20)}/20${st.p[i].pos>=20?' · Zielgerade':''}`,
  hint:(st,p)=>{const x=st.p[p].pos;return x>=20?'Ziel: Bull!':`Nächstes Feld: ${x%5===4?'🚧 Doppel ':''}${ORD[x]}`;},result:st=>byDesc(st,x=>x.pos)},
 killer:killerGame(false),blindkiller:killerGame(true),
 gotcha:{name:'Gotcha',cat:'💀 Gruppe',min:2,max:8,dur:12,desc:'Wer genau auf 301 kommt, gewinnt – aber pass auf, dass dich keiner einholt.',
  rules:['Alle zählen von 0 hoch, Ziel ist genau 301.','Wirfst du über 301, zählt die ganze Aufnahme nicht.','Hast du nach deiner Aufnahme genau den gleichen Stand wie ein anderer, fällt dieser auf 0 zurück! 😈','Wer zuerst genau 301 hat, gewinnt.'],

  dart(st,p,d){const me=st.p[p];me.s+=d.v;if(me.s>301){me.s=me.ts;toast('Überworfen!');st.endTurn=true;}else if(me.s===301)st.winner=p;},

  status:(st,i)=>`<b>${st.p[i].s}</b> / 301`,hint:(st,p)=>`Noch ${301-st.p[p].s} bis 301`,result:st=>byDesc(st,x=>x.s)},
 knockout:{name:'Knockout',cat:'💀 Gruppe',min:2,max:8,dur:10,desc:'Überbiete die Aufnahme deines Vorgängers – sonst kostet es ein Leben.',
  rules:['Jeder hat 3 Leben.','Deine Aufnahme muss mindestens so hoch sein wie die deines Vorgängers.','Schaffst du das nicht, verlierst du ein Leben.','Wer als Letzter übrig ist, gewinnt.'],
  init(st){st.p.forEach(x=>x.lives=3);st.last=null;},active:(st,i)=>st.p[i].lives>0,start(st,p){st.p[p].t=0;},

 ninelives:{name:'Nine Lives',cat:'💀 Gruppe',min:1,max:8,dur:12,desc:'Rund um die Uhr – aber jede leere Aufnahme kostet ein Leben.',

 followleader:{name:'Follow the Leader',cat:'💀 Gruppe',min:2,max:8,dur:10,desc:'Triff, was dein Vorgänger vorgibt – und gib selbst etwas vor.',

 elimination:{name:'Elimination',cat:'💀 Gruppe',min:2,max:8,dur:12,desc:'Rennen auf 301 – wer gleichzieht, wirft den anderen raus.',

 suddendeath:{name:'Sudden Death',cat:'💀 Gruppe',min:2,max:8,dur:8,desc:'Jede Runde fliegt der mit der niedrigsten Aufnahme raus.',

 highlow:{name:'Higher 45 · Lower 26',cat:'💀 Gruppe',min:2,max:8,dur:10,visitInput:true,desc:'Wirf über das Higher oder unter das Lower – sonst kostet es ein Leben.',

 scam:{name:'Scam',cat:'❌ Taktik',min:2,max:2,dur:15,desc:'Einer sperrt Zahlen, der andere sammelt Punkte – dann wird getauscht.',

   else if((d.n>=1&&d.n<=20&&!st.closed[d.n])||d.n===25)st.p[p].s+=d.v;},

 tictactoe:{name:'Tic-Tac-Toe',cat:'❌ Taktik',min:2,max:2,dur:6,desc:'Drei in einer Reihe – auf dem Dartboard.',

  init(st){const ns=shuffleNums(8);st.grid=[...ns.slice(0,4),25,...ns.slice(4)];st.own=Array(9).fill(null);},
  dart(st,p,d){const i=st.grid.indexOf(d.n);if(i<0||st.own[i]!==null)return;st.own[i]=p;
   const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];if(L.some(l=>l.every(k=>st.own[k]===p))){st.winner=p;return;}if(st.own.every(x=>x!==null)){st.draw=true;st.done=true;}},
  status:(st,i)=>`${i===0?'❌':'⭕'} ${st.own.filter(x=>x===i).length} Felder`,hint:()=>'Triff ein freies Feld',

 by5:{name:'51 by 5',cat:'🔢 Rechnen',min:1,max:8,dur:10,rounds:25,desc:'Nur durch 5 teilbare Aufnahmen zählen – wer erreicht genau 51?',
  rules:['Alle 3 Darts müssen treffen, sonst zählt die Aufnahme nicht.','Ist die Summe deiner Aufnahme durch 5 teilbar, bekommst du Summe ÷ 5 Punkte (z. B. 45 → 9 Punkte).','Ziel ist genau 51 – wer darüber käme, bekommt nichts.','Wer zuerst genau 51 hat, gewinnt – spätestens nach 25 Runden gewinnt der Höchste. Super Kopfrechen-Training!'],
  init(st){st.p.forEach(x=>x.s=0);},start(st,p){st.p[p].t=0;st.p[p].miss=false;},

 countup:{name:'Count Up',cat:'🔢 Rechnen',min:1,max:8,dur:8,rounds:8,desc:'8 Runden, so viele Punkte wie möglich.',

 const cats=[...new Set(Object.values(MG).map(g=>g.cat))];const n=mgSlots.length;
 return `<div class="card"><label style="margin-top:0">Wer spielt?</label>${slotsHTML('mgSlots',mgSlots,{max:8,allowGuest:true,fixedFirst:self,addLabel:'Spieler hinzufügen'})}</div>
 ${cats.map(c=>`<div class="sec">${c}</div><div class="grid2">${Object.entries(MG).filter(([k,g])=>g.cat===c).map(([k,g])=>{const ok=n>=g.min&&n<=g.max;
  return `<button class="tile" onclick="go('mg','${k}')" style="${ok?'':'opacity:.55'}"><div class="row" style="width:100%"><b class="sp">${g.name}</b><span class="badge">${g.min===g.max?g.min:g.min+'–'+g.max} Sp.</span></div><small>${g.desc}</small></button>`;}).join('')}</div>`).join('')}`;}
function vMGDetail(id){const g=MG[id];if(!g){view='train';return vTrain();}const n=mgSlots.length;const ok=n>=g.min&&n<=g.max;
 const runs=S.trainings.filter(t=>t.mode==='mg'&&t.mg===id);
 return `<button class="sm ghost" onclick="go('train')" style="margin-bottom:12px">← Minispiele</button>
 <span class="badge">${g.cat}</span><h1 style="font-size:32px;margin:8px 0">${g.name}</h1><p class="muted" style="font-size:17px;margin-top:0">${g.desc}</p>
 <div class="stats" style="margin:16px 0"><div class="stat"><div class="k">👥 Spieler</div><div class="v">${g.min===g.max?g.min:g.min+'–'+g.max}</div></div><div class="stat"><div class="k">⏱ Dauer</div><div class="v">~${g.dur} Min.</div></div><div class="stat"><div class="k">Gespielt</div><div class="v">${new Set(runs.map(r=>r.gid)).size}×</div></div></div>
 <div class="card"><h3>Regeln</h3>${g.rules.map((s,i)=>`<div class="row" style="flex-wrap:nowrap;align-items:flex-start;margin:10px 0"><span style="flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #2fbf7188;background:#2fbf7118;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px">${i+1}</span><span style="padding-top:4px">${s}</span></div>`).join('')}</div>
 <div class="card"><label style="margin-top:0">Wer spielt?</label>${slotsHTML('mgSlots',mgSlots,{max:g.max,allowGuest:true,fixedFirst:me().role==='player'})}</div>
 ${ok?'':`<p style="color:#ff6b72">Für ${g.name} braucht ihr ${g.min===g.max?'genau '+g.min:g.min+' bis '+g.max} Spieler.</p>`}
 <button class="pri" style="width:100%;padding:18px;font-size:19px" ${ok?'':'disabled'} onclick="startMG('${id}')">▶ Spiel starten</button>`;}
function startMG(id){const g=MG[id];const ps=slotIds(mgSlots);if(ps.length<g.min||ps.length>g.max)return toast('Falsche Spielerzahl');
 const st={kind:'mg',id,gid:uid(),input:'',ps,p:ps.map(()=>({})),cur:0,dart:0,round:1,darts:[],mult:1,hist:[],winner:null,done:false,endTurn:false};
 g.init(st);g.start?.(st,0);S.live=st;save();go('live');}
function mgActive(st,i){const g=MG[st.id];return g.active?g.active(st,i):true;}
function mgRules(){const g=MG[S.live.id];modal(`<h3>${g.name}</h3>${g.rules.map(r=>`<p>• ${r}</p>`).join('')}<button class="pri" style="width:100%" onclick="closeModal()">OK</button>`);}
function mgMult(m){S.live.mult=S.live.mult===m?1:m;render();}
function mgThrow(n){const st=S.live,g=MG[st.id];let m=n===0?0:st.mult;if(n===25&&m===3)m=2;
 const d={n,m,v:n===0?0:n===25?(m===2?50:25):n*m};
 st.hist.push(JSON.stringify({...st,hist:undefined}));if(st.hist.length>60)st.hist.shift();
 st.darts.push(d);st.mult=1;g.dart(st,st.cur,d);st.dart++;
 if(st.winner!==null||st.done)return mgEnd();
 if(st.endTurn||st.dart>=3||!mgActive(st,st.cur))mgNext();
 if(S.live&&(st.winner!==null||st.done))return mgEnd();
 save();render();}
function mgNext(){const st=S.live,g=MG[st.id];g.endTurn?.(st,st.cur);if(st.winner!==null||st.done)return;
 const n=st.ps.length;let i=st.cur,wrapped=false;
 for(let k=0;k<n;k++){i++;if(i>=n){i=0;wrapped=true;}if(mgActive(st,i))break;}
 if(wrapped){g.endRound?.(st);st.round++;if(g.rounds&&st.round>g.rounds){st.done=true;return;}}
 const alive=st.ps.map((x,j)=>j).filter(j=>mgActive(st,j));if(!alive.length){st.done=true;return;}if(n>1&&alive.length<=1){st.winner=alive[0];st.done=true;return;}
 if(!mgActive(st,i)){i=alive[0];}
 st.cur=i;st.dart=0;st.darts=[];st.endTurn=false;g.start?.(st,i);}
function mgVisit(v){const st=S.live,g=MG[st.id];if(v>180||IMPOSSIBLE.includes(v)){toast(`${v} ist nicht möglich`);render();return;}
 st.hist.push(JSON.stringify({...st,hist:undefined}));if(st.hist.length>60)st.hist.shift();
 g.visit(st,st.cur,v);if(st.winner!==null||st.done)return mgEnd();st.endTurn=true;mgNext();if(st.winner!==null||st.done)return mgEnd();save();render();}
function mgUndo(){const st=S.live;const h=st.hist.pop();if(!h)return toast('Nichts zum Rückgängigmachen');const o=JSON.parse(h);o.hist=st.hist;S.live=o;save();render();}
function mgEnd(){const st=S.live,g=MG[st.id];let rank=g.result(st);if(st.winner!==null){rank=[st.winner,...rank.filter(i=>i!==st.winner)];}
 const draw=st.draw;st.ps.forEach((id,i)=>{if(!isGuest(id))S.trainings.push({id:uid(),uid:id,date:Date.now(),mode:'mg',mg:st.id,gid:st.gid,rank:draw?1:rank.indexOf(i)+1,n:st.ps.length});});
 S.live=null;save();view='mg';param=st.id;render();
 modal(`<h2>${draw?'🤝 Unentschieden!':`🏆 ${esc(U(st.ps[rank[0]]).nick)} gewinnt!`}</h2><p class="muted">${g.name}</p>
 <table>${rank.map((i,k)=>`<tr><td>${draw?'–':k+1+'.'}</td><td>${AV(U(st.ps[i]),26)} ${esc(U(st.ps[i]).nick)}</td><td style="text-align:right">${g.status(st,i)}</td></tr>`).join('')}</table>
 <div class="row" style="margin-top:14px"><button class="ghost sp" onclick="closeModal()">Schließen</button><button class="pri sp" onclick="closeModal();startMG('${st.id}')">Revanche</button></div>`);}
function vMG(){const st=S.live,g=MG[st.id];const p=st.cur;
 const nums=[...Array(20).keys()].map(i=>i+1);
 return `<div class="row muted small" style="margin-bottom:8px"><b style="color:var(--text)">${g.name}</b>${g.rounds?`<span>· Runde ${Math.min(st.round,g.rounds)} von ${g.rounds}</span>`:''}<span class="sp"></span><button class="sm ghost" onclick="mgRules()">📖 Regeln</button></div>
 <div class="card" style="padding:10px 12px">${st.ps.map((id,i)=>`<div class="row" style="flex-wrap:nowrap;padding:8px;border-radius:12px;${i===p?'background:linear-gradient(90deg,#1fb35a26,transparent);box-shadow:inset 3px 0 0 var(--accent)':''};${mgActive(st,i)?'':'opacity:.45'}">${AV(U(id),36)}<div class="sp" style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(U(id).nick)}</b><div class="muted small" style="margin-top:2px">${g.status(st,i)}</div></div>${i===p?'<span class="badge g">am Zug</span>':''}</div>`).join('')}</div>
 ${g.extra?g.extra(st):''}
 <div class="card" style="text-align:center;padding:14px"><div class="muted small">${esc(U(st.ps[p]).nick)} ist dran${g.visitInput?' · Aufnahme eintippen':` · Dart ${st.dart+1} von 3`}</div>
 <div style="font-family:Outfit,Inter,sans-serif;font-size:22px;font-weight:800;margin:6px 0">${g.hint(st,p)}</div>
 ${g.visitInput?'':`<div class="row" style="justify-content:center;gap:6px">${[0,1,2].map(k=>`<span class="badge" style="min-width:64px;font-size:14px;${k===st.dart?'border-color:var(--accent);color:var(--text)':''}">${st.darts[k]?dName(st.darts[k]):'·'}</span>`).join('')}</div>`}</div>
 ${g.visitInput?`<div class="card" style="padding:12px"><div class="inbox">${st.input||'<span class="muted" style="font-size:22px">Punkte der Aufnahme</span>'}</div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}<button onclick="if(S.live.input){S.live.input='';render();}else mgUndo()" style="font-size:16px">↶ Rückgängig</button><button onclick="key('0')">0</button><button class="pri" onclick="key('ok')">OK</button></div></div>`
 :`<div class="card mgpad" style="padding:12px">
 <div class="row" style="gap:6px;margin-bottom:8px">${[[1,'Single'],[2,'Double'],[3,'Triple']].map(([m,l])=>`<button class="sp ${st.mult===m?'on':''}" style="padding:12px 0" onclick="mgMult(${m})">${l}</button>`).join('')}</div>
 <div class="mggrid">${nums.map(n=>`<button onclick="mgThrow(${n})">${st.mult===3?'T':st.mult===2?'D':''}${n}</button>`).join('')}</div>
 <div class="row" style="gap:6px;margin-top:6px"><button class="sp" style="padding:14px 0;font-weight:800" onclick="mgThrow(25)">${st.mult>=2?'Bullseye 50':'Bull 25'}</button><button class="sp red" style="padding:14px 0" onclick="mgThrow(0)">Daneben</button><button style="padding:14px 18px" onclick="mgUndo()">↶</button></div></div>`}`;}

const real=v=>!!v&&v!=='BYE';
const boardsN=()=>S.settings.boards||4;
const playable=m=>real(m.a)&&real(m.b)&&!m.winner;
let tset=null;
function vTour(){const list=[...S.tournaments].sort((a,b)=>b.created-a.created);const staff=isStaff();
 const card=t=>{const open=t.matches.filter(playable).length;const done=t.status==='done';const mine=t.matches.filter(m=>m.winner&&!m.bye).length,all=t.matches.filter(m=>real(m.a)&&real(m.b)).length;
  return `<div class="card tcard ${done?'done':'live'}" style="cursor:pointer" onclick="go('tourview','${t.id}')"><div class="row"><b class="sp" style="font-size:17px">${esc(t.name)}</b>

  ${!done&&all?`<div style="height:6px;background:var(--panel2);border-radius:99px;margin-top:10px;overflow:hidden"><div style="height:100%;width:${mine/all*100}%;background:var(--accent)"></div></div>`:''}</div>`;};
 const live=list.filter(t=>t.status!=='done'),done=list.filter(t=>t.status==='done');
 return `<div class="ph"><div class="row"><h1 class="sp">Turniere</h1>${staff?`<button class="pri" onclick="go('tournew')">＋ Neues Turnier</button>`:''}</div><p>Training, Turniere und Ligen des Vereins</p></div>
 ${list.length?`${live.length?`<div class="sec" style="margin-top:0">Laufend (${live.length})</div>${live.map(card).join('')}`:''}${done.length?`<div class="sec">Beendet (${done.length})</div>${done.map(card).join('')}`:''}`
 :`<div class="card muted">${staff?'Noch keine Turniere. Erstelle das erste für euer nächstes Training!':'Noch keine Turniere – der Verein legt sie an.'}</div>`}`;}
function boardStepper(){return `<div class="row"><span class="muted">Boards im Verein:</span><button class="sm" onclick="setBoards(${boardsN()-1})">−</button><b style="min-width:28px;text-align:center;font-size:20px">${boardsN()}</b><button class="sm" onclick="setBoards(${boardsN()+1})">＋</button></div>`;}
function setBoards(n){n=Math.max(1,Math.min(32,n));S.settings.boards=n;if(tset){tset.boards=tset.boards.filter(b=>b<=n);if(!tset.boards.length)tset.boards=[1];}save();render();}
function tSet(k,v){tset[k]=v;render();}
function vTourNew(){const n=boardsN();if(!tset)tset={name:'Training '+new Date().toLocaleDateString('de-DE'),kind:'training',mode:'ko',start:S.settings.defaults.start,fmt:{...S.settings.defaults.fmt},dOut:S.settings.defaults.dOut,bestOfFinal:3,players:[],boards:[...Array(n).keys()].map(i=>i+1),groupCount:2,qual:2,swissRounds:4,rueck:true,startDate:new Date().toISOString().slice(0,10),interval:7};
 const np=tset.players.length,maxG=Math.max(2,Math.floor(np/2));if(tset.groupCount>maxG)tset.groupCount=maxG;
 const finals=['ko','dko','groups'].includes(tset.mode);
 return `<div class="row" style="margin-bottom:12px"><button class="sm ghost" onclick="tset=null;go('tour')">← Zurück</button><h2 style="margin:0">Neues Turnier</h2></div>
 <div class="card"><label style="margin-top:0">Name</label><input value="${esc(tset.name)}" oninput="tset.name=this.value">
 <label>Art</label><div class="chips"><button class="${tset.kind==='training'?'on':''}" onclick="tSet('kind','training')">Training</button><button class="${tset.kind==='turnier'?'on':''}" onclick="tSet('kind','turnier')">Turnier</button></div>
 <label>Modus</label><div class="chips">${Object.entries(MODES).map(([k,l])=>`<button class="${tset.mode===k?'on':''}" onclick="tSet('mode','${k}')">${l}</button>`).join('')}</div>
 <p class="muted small" style="margin:8px 0 0">${{league:'Feste Spieltage mit Tabelle – jeder spielt gegen jeden, auf Wunsch mit Hin- und Rückrunde. Sieg = 2 Punkte, Unentschieden = 1 Punkt.',ko:'Wer verliert, ist raus.',dko:'Erst nach der zweiten Niederlage raus – Verlierer spielen in der Verliererrunde weiter.',groups:'Erst Gruppen (jeder gegen jeden), dann K.-o.-Runde mit den Besten jeder Gruppe.',swiss:'Feste Rundenzahl, jede Runde spielen Spieler mit gleich vielen Siegen gegeneinander. Keiner fliegt raus – ideal fürs Training.',rr:'Alle spielen gegen alle.'}[tset.mode]}</p>
 ${tset.mode==='groups'?`<label>Anzahl Gruppen</label><div class="chips">${[2,3,4,5,6,8].filter(g=>g<=maxG||g===2).map(g=>`<button class="${tset.groupCount===g?'on':''}" onclick="tSet('groupCount',${g})">${g}</button>`).join('')}</div>
  <label>Weiter pro Gruppe</label><div class="chips">${[1,2,3,4].map(q=>`<button class="${tset.qual===q?'on':''}" onclick="tSet('qual',${q})">${q}</button>`).join('')}</div>`:''}
 ${tset.mode==='league'?leagueOpts():''}
 ${tset.mode==='swiss'?`<label>Runden</label><div class="chips">${[3,4,5,6,7].map(q=>`<button class="${tset.swissRounds===q?'on':''}" onclick="tSet('swissRounds',${q})">${q}</button>`).join('')}</div>`:''}
 ${(()=>{const ae=!['ko','dko'].includes(tset.mode);if(!ae&&tset.fmt&&tset.fmt.bo%2===0)tset.fmt.bo=Math.min(11,tset.fmt.bo+1);return optsHTML(tset,'tset',ae,tset.mode==='groups'?'In der K.-o.-Runde wird dann mit einem mehr gespielt (dort gibt es kein Unentschieden).':'');})()}
 ${finals?`<label>Finale</label>${stepperHTML(`Finale: Best of ${tset.fmt.sets?'Sets':'Legs'}`,tset.bestOfFinal,`tSet('bestOfFinal',stepBo(tset.bestOfFinal,-1,false))`,`tSet('bestOfFinal',stepBo(tset.bestOfFinal,1,false))`,tset.bestOfFinal>1,tset.bestOfFinal<11,`${fmtNeed(tset.bestOfFinal)} ${tset.fmt.sets?'Sets':'Legs'} zum Turniersieg`)}`:''}
 <label>Boards</label>${boardStepper()}
 <p class="muted small" style="margin:8px 0">Welche Boards nutzt dieses Turnier? Spiele werden automatisch auf freie Boards verteilt.</p>
 <div class="chips">${[...Array(n).keys()].map(i=>i+1).map(b=>`<button class="${tset.boards.includes(b)?'on':''}" onclick="togB(${b})">Board ${b}</button>`).join('')}</div>
 <label>Teilnehmer (${np})</label>
 <div class="searchbox"><input id="tq" placeholder="Spieler suchen und hinzufügen …" autocomplete="off" value="${esc(tq)}" oninput="tq=this.value;document.getElementById('tqr').innerHTML=tqResults()"></div>
 <div class="results" id="tqr">${tqResults()}</div>
 <div class="row" style="margin:8px 0"><button class="sm ghost" onclick="tset.players=players().map(p=>p.id);render()">Alle ${players().length} hinzufügen</button>${np?`<button class="sm ghost" onclick="tset.players=[];render()">Alle entfernen</button>`:''}</div>
 <div class="selchips">${tset.players.map(id=>`<span class="selchip">${AV(U(id),22)} ${esc(U(id).nick)}<button onclick="togT('${id}')">✕</button></span>`).join('')||'<span class="muted small">Noch niemand ausgewählt.</span>'}</div>
 ${tset.mode==='groups'&&np>=4?`<p class="muted small">${tset.groupCount} Gruppen à ca. ${Math.round(np/tset.groupCount)} Spieler, ${Math.min(tset.qual,Math.floor(np/tset.groupCount))*tset.groupCount} kommen in die K.-o.-Runde.</p>`:''}
 <button class="pri" style="width:100%;margin-top:18px;padding:16px" onclick="createTour()" ${np>=(tset.mode==='groups'?4:2)&&tset.boards.length?'':'disabled'}>Turnier erstellen & auslosen</button>
 ${tset.mode==='groups'&&np<4?'<p class="muted small">Für Gruppen braucht es mindestens 4 Spieler.</p>':''}</div>`;}
let tq='';
function tqResults(){const q=tq.trim().toLowerCase();if(!q)return'';const ps=players().filter(p=>!tset.players.includes(p.id)&&p.nick.toLowerCase().includes(q)).slice(0,8);
 return ps.length?ps.map(p=>`<button class="pick-item" onclick="togT('${p.id}');tq='';render();setTimeout(()=>document.getElementById('tq')?.focus(),30)">${AV(p,30)} <b>${esc(p.nick)}</b><span class="sp"></span><span style="color:var(--accent)">＋</span></button>`).join(''):'<p class="muted small" style="margin:6px 4px">Niemand gefunden.</p>';}
function togT(id){const i=tset.players.indexOf(id);i>=0?tset.players.splice(i,1):tset.players.push(id);render();}
function togB(b){const i=tset.boards.indexOf(b);if(i>=0){if(tset.boards.length>1)tset.boards.splice(i,1);}else tset.boards.push(b);tset.boards.sort((a,b)=>a-b);render();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mk(t,o){const m={id:uid(),a:null,b:null,winner:null,la:0,lb:0,board:null,next:null,...o};t.matches.push(m);return m;}

/* --- Jeder gegen jeden (Rundenplan nach Kreismethode) --- */
function rrPairs(ids){const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,out=[];
 for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)out.push([x,y,r]);}a.splice(1,0,a.pop());}return out;}
function table(ids,ms){const row={};ids.forEach(id=>row[id]={id,sp:0,s:0,u:0,lf:0,la:0,bh:0,pts:0});
 ms.filter(m=>m.winner).forEach(m=>{if(m.bye){if(row[m.a])row[m.a].s++;return;}const A=row[m.a],B=row[m.b];if(!A||!B)return;A.sp++;B.sp++;A.lf+=m.la;A.la+=m.lb;B.lf+=m.lb;B.la+=m.la;if(m.winner==='DRAW'){A.u++;B.u++;}else row[m.winner].s++;});
 Object.values(row).forEach(r=>r.pts=r.s*2+r.u);
 return Object.values(row).sort((x,y)=>y.pts-x.pts||(y.lf-y.la)-(x.lf-x.la)||y.lf-x.lf);}

/* --- K.-o. / Doppel-K.-o. Baum --- */
function randomPairs(ids){const ps=shuffle(ids.slice());let size=2;while(size<ps.length)size*=2;const byes=size-ps.length,pairs=[];
 for(let i=0;i<byes;i++)pairs.push([ps[i],'BYE']);for(let i=byes;i<ps.length;i+=2)pairs.push([ps[i],ps[i+1]]);return shuffle(pairs);}
function seededSlots(pairs){const n=pairs.length,pos=[];let lo=0,hi=n-1;while(lo<=hi){pos.push(lo++);if(lo<=hi)pos.push(hi--);}const out=Array(n);pairs.forEach((p,i)=>out[pos[i]]=p);return out;}
function buildBracket(t,pairs,double){const size=pairs.length*2,k=Math.log2(size);t.rounds=k;const W=[];
 for(let r=0;r<k;r++){W[r]=[];for(let s=0;s<size/2**(r+1);s++)W[r].push(mk(t,{br:'W',r,s}));}
 for(let r=0;r<k-1;r++)W[r].forEach((m,s)=>m.next={w:[W[r+1][s>>1].id,s%2?'b':'a']});
 if(double){const GF=mk(t,{br:'GF',r:0,s:0});const LR=2*(k-1);t.lrounds=LR;const L=[];
  for(let j=1;j<=LR;j++){L[j]=[];const cnt=size/2**(Math.floor((j+1)/2)+1);for(let s=0;s<cnt;s++)L[j].push(mk(t,{br:'L',r:j,s}));}
  if(k>=2){W[0].forEach((m,s)=>{m.next=m.next||{};m.next.l=[L[1][s>>1].id,s%2?'b':'a'];});
   for(let j=1;j<=k-1;j++){const lr=L[2*j];W[j].forEach((m,s)=>{m.next=m.next||{};m.next.l=[lr[lr.length-1-s].id,'b'];});
    L[2*j-1].forEach((m,s)=>m.next={w:[L[2*j][s].id,'a']});
    if(2*j<LR)L[2*j].forEach((m,s)=>m.next={w:[L[2*j+1][s>>1].id,s%2?'b':'a']});}
   L[LR][0].next={w:[GF.id,'b']};}
  else{W[0][0].next={l:[GF.id,'b']};}
  W[k-1][0].next={...(W[k-1][0].next||{}),w:[GF.id,'a']};}
 pairs.forEach(([a,b],s)=>{W[0][s].a=a;W[0][s].b=b;});W[0].forEach(m=>resolve(t,m));}
function resolve(t,m){if(m.winner||m.a==null||m.b==null)return;if(m.a==='BYE'||m.b==='BYE'){m.bye=true;finish(t,m,m.a==='BYE'?m.b:m.a,'BYE');}}
function place(t,[id,side],v){const n=t.matches.find(x=>x.id===id);n[side]=v;resolve(t,n);}
function finish(t,m,w,l){m.winner=w;m.loser=l;if(m.next?.w)place(t,m.next.w,w);if(m.next?.l)place(t,m.next.l,l);
 if(!m.next?.w&&(m.br==='W'||m.br==='GF')){t.status='done';t.winner=w;}}

/* --- Gruppen --- */
function groupQualifiers(t){const tabs=t.groups.map((g,gi)=>table(g,t.matches.filter(m=>m.br==='G'&&m.g===gi)).map(r=>r.id));
 const flat=[];for(let p=0;p<t.qual;p++)tabs.forEach((tb,gi)=>{if(tb[p])flat.push({id:tb[p],g:gi});});
 let size=2;while(size<flat.length)size*=2;let byes=size-flat.length;const pairs=[],pool=flat.slice();
 while(byes-->0)pairs.push([pool.shift().id,'BYE']);
 while(pool.length){const a=pool.shift();let j=-1;for(let i=pool.length-1;i>=0;i--)if(pool[i].g!==a.g){j=i;break;}if(j<0)j=pool.length-1;pairs.push([a.id,pool.splice(j,1)[0].id]);}
 return seededSlots(pairs);}

/* --- Schweizer System --- */
function swissTable(t){const ms=t.matches.filter(m=>m.br==='S');const tb=table(t.players,ms);const pts={};tb.forEach(r=>pts[r.id]=r.pts);
 ms.filter(m=>m.winner&&!m.bye).forEach(m=>{tb.find(r=>r.id===m.a).bh+=pts[m.b];tb.find(r=>r.id===m.b).bh+=pts[m.a];});
 return tb.sort((x,y)=>y.pts-x.pts||y.bh-x.bh||(y.lf-y.la)-(x.lf-x.la));}
function pairSwiss(t,r){const order=r===1?shuffle(t.players.slice()):swissTable(t).map(x=>x.id);
 const ms=t.matches.filter(m=>m.br==='S');const met=new Set();ms.forEach(m=>{met.add(m.a+'|'+m.b);met.add(m.b+'|'+m.a);});
 const pool=order.slice();
 if(pool.length%2){const had=new Set(ms.filter(m=>m.bye).map(m=>m.a));let i=pool.length-1;while(i>0&&had.has(pool[i]))i--;const p=pool.splice(i,1)[0];mk(t,{br:'S',r,s:99,a:p,b:'BYE',winner:p,bye:true});}
 let s=0;while(pool.length){const a=pool.shift();let j=pool.findIndex(b=>!met.has(a+'|'+b));if(j<0)j=0;mk(t,{br:'S',r,s:s++,a,b:pool.splice(j,1)[0]});}
 t.curRound=r;}

function createTour(){const t=makeTour(tset);tset=null;toast('Turnier erstellt & ausgelost 🎲');go('tourview',t.id);}
function makeTour(cfg){const t={id:uid(),created:Date.now(),status:'open',winner:null,...JSON.parse(JSON.stringify(cfg)),matches:[]};const ps=t.players;
 if(t.mode==='ko'||t.mode==='dko')buildBracket(t,randomPairs(ps),t.mode==='dko');
 if(t.mode==='rr')rrPairs(shuffle(ps.slice())).forEach(([a,b,r],i)=>mk(t,{br:'RR',r,s:i,a,b}));
 if(t.mode==='groups'){t.phase='groups';const sh=shuffle(ps.slice());t.groups=[...Array(t.groupCount)].map(()=>[]);sh.forEach((p,i)=>t.groups[i%t.groupCount].push(p));
  t.qual=Math.min(t.qual,Math.min(...t.groups.map(g=>g.length)));
  t.groups.forEach((g,gi)=>rrPairs(g).forEach(([a,b,r],i)=>mk(t,{br:'G',g:gi,r,s:i,a,b})));}
 if(t.mode==='swiss')pairSwiss(t,1);
 if(t.mode==='league'){const pr=rrPairs(shuffle(ps.slice()));const R=Math.max(...pr.map(x=>x[2]))+1;t.half=R;t.days=R*(t.rueck?2:1);
  pr.forEach(([a,b,r],i)=>mk(t,{br:'LG',r,s:i,a,b}));if(t.rueck)pr.forEach(([a,b,r],i)=>mk(t,{br:'LG',r:r+R,s:i,a:b,b:a}));}
 S.tournaments.push(t);assignAll();save();return t;}
function checkPhase(t){
 if(t.mode==='league'&&t.matches.every(m=>m.winner)){t.status='done';t.winner=leagueTable(t)[0].id;}
 if(t.mode==='rr'&&t.matches.every(m=>m.winner)){t.status='done';t.winner=table(t.players,t.matches)[0].id;}
 if(t.mode==='swiss'){const cur=t.matches.filter(m=>m.br==='S'&&m.r===t.curRound);if(cur.every(m=>m.winner)){if(t.curRound<t.swissRounds){pairSwiss(t,t.curRound+1);toast(`Runde ${t.curRound} ist ausgelost`);}else{t.status='done';t.winner=swissTable(t)[0].id;}}}
 if(t.mode==='groups'&&t.phase==='groups'&&t.matches.filter(m=>m.br==='G').every(m=>m.winner)){t.phase='ko';buildBracket(t,groupQualifiers(t),false);toast('Gruppenphase beendet – K.-o.-Runde ausgelost!');}}
function applyResult(tid,mid,w,la,lb){const t=S.tournaments.find(x=>x.id===tid);if(!t)return;const m=t.matches.find(x=>x.id===mid);if(!m||m.winner)return;
 m.la=la;m.lb=lb;
 if(w==='DRAW'){m.winner='DRAW';}else{const l=w===m.a?m.b:m.a;if(['W','L','GF'].includes(m.br))finish(t,m,w,l);else m.winner=w;}
 checkPhase(t);assignAll();}
function tFmt(t){return t.fmt||{sets:false,bo:t.bestOf||3,setLegs:3};}
function isKO(m){return['W','L','GF'].includes(m.br);}
function fmtOf(t,m){const f={...tFmt(t)};if(m.br==='GF'||(m.br==='W'&&!m.next?.w))f.bo=t.bestOfFinal||f.bo;if(isKO(m)&&f.bo%2===0)f.bo=Math.min(11,f.bo+1);return f;}
function matchBestOf(t,m){return fmtOf(t,m).bo;}


/* --- Liga --- */
function leagueOpts(){const n=tset.players.length;const R=n<2?0:(n%2?n:n-1);const days=R*(tset.rueck?2:1);
 return `<label>Runden</label><div class="chips"><button class="${!tset.rueck?'on':''}" onclick="tSet('rueck',false)">Nur Hinrunde</button><button class="${tset.rueck?'on':''}" onclick="tSet('rueck',true)">Hin- & Rückrunde</button></div>
 <label>Erster Spieltag</label><input type="date" value="${tset.startDate||''}" onchange="tset.startDate=this.value;render()" style="max-width:220px">
 <label>Abstand zwischen Spieltagen</label><div class="chips">${[[7,'1 Woche'],[14,'2 Wochen'],[0,'ohne Datum']].map(([v,l])=>`<button class="${tset.interval===v?'on':''}" onclick="tSet('interval',${v})">${l}</button>`).join('')}</div>
 ${n>=2?`<p class="muted small" style="margin-top:10px">→ <b style="color:var(--text)">${days} Spieltage</b> mit ${n} Spielern${n%2?' (pro Spieltag hat einer spielfrei)':''}. Für z. B. 8 Spieltage mit Hin- & Rückrunde: 4 oder 5 Spieler.</p>`:''}`;}
function curDay(t){const open=t.matches.filter(m=>!m.winner).map(m=>m.r);return open.length?Math.min(...open):-1;}
function dayDate(t,r){if(!t.startDate||!t.interval)return'';const d=new Date(t.startDate);d.setDate(d.getDate()+r*t.interval);return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});}
function leagueTable(t){const tb=table(t.players,t.matches);const av={};S.games.filter(g=>g.tid===t.id).forEach(g=>g.players.forEach(p=>{av[p.id]=av[p.id]||{d:0,p:0};av[p.id].d+=p.darts;av[p.id].p+=p.pts;}));
 tb.forEach(r=>{r.n=r.sp-r.s-r.u;r.pkt=r.pts;r.avg=av[r.id]&&av[r.id].d?av[r.id].p/av[r.id].d*3:null;});return tb;}
function leagueView(t){const tb=leagueTable(t);const cd=curDay(t);
 let h=`<div class="card" style="overflow-x:auto"><h3>Tabelle ${t.status!=='done'&&cd>=0?`<span class="muted small">· aktuell ${cd+1}. Spieltag von ${t.days}</span>`:''}</h3>
 <table><tr><th>#</th><th>Spieler</th><th>Sp.</th><th>S</th><th>U</th><th>N</th><th>${tFmt(t).sets?'Sets':'Legs'}</th><th>Diff</th><th>Ø</th><th>Pkt.</th></tr>${tb.map((r,i)=>`<tr ${i===0&&r.sp?'style="background:#f2c14e10"':''}><td>${i+1}</td><td>${AV(U(r.id))} ${esc(U(r.id).nick)}</td><td>${r.sp}</td><td>${r.s}</td><td>${r.u}</td><td>${r.n}</td><td>${r.lf}:${r.la}</td><td>${r.lf-r.la>0?'+':''}${r.lf-r.la}</td><td>${r.avg!=null?f1(r.avg):'–'}</td><td><b>${r.pkt}</b></td></tr>`).join('')}</table></div>`;
 const order=[...Array(t.days).keys()];const sorted=cd>=0?[...order.filter(r=>r>=cd),...order.filter(r=>r<cd).reverse()]:order;
 sorted.forEach(r=>{const ms=t.matches.filter(m=>m.r===r);const inn=new Set(ms.flatMap(m=>[m.a,m.b]));const free=t.players.filter(p=>!inn.has(p));const done=ms.every(m=>m.winner);
  h+=`<div class="card" ${r!==cd&&done?'style="opacity:.85"':''}><div class="row" style="margin-bottom:10px"><h3 class="sp" style="margin:0">${r+1}. Spieltag ${dayDate(t,r)?`<span class="muted small">· ${dayDate(t,r)}</span>`:''}</h3>
  <span class="badge">${t.rueck?(r<t.half?'Hinrunde':'Rückrunde'):''}</span>${r===cd?'<span class="badge y">aktuell</span>':done?'<span class="badge g">gespielt</span>':''}</div>
  <div class="grid2">${ms.map(m=>matchHTML(t,m)).join('')}</div>${free.length?`<p class="muted small" style="margin:10px 0 0">Spielfrei: ${free.map(id=>esc(U(id).nick)).join(', ')}</p>`:''}</div>`;});
 return h;}
/* --- Boards automatisch zuteilen --- */
function activeTours(){return S.tournaments.filter(t=>t.status!=='done').sort((a,b)=>a.created-b.created);}
function prio(m){return m.br==='GF'?999:m.br==='L'?m.r:m.br==='W'?m.r*2+1:m.r;}
function assignAll(){const occ=new Set(),busy=new Set();
 activeTours().forEach(t=>t.matches.forEach(m=>{if(m.board&&!m.winner){occ.add(m.board);busy.add(m.a);busy.add(m.b);}}));
 activeTours().forEach(t=>t.matches.filter(m=>playable(m)&&!m.board&&(t.mode!=='league'||m.r===curDay(t))).sort((a,b)=>prio(a)-prio(b)).forEach(m=>{
  if(busy.has(m.a)||busy.has(m.b))return;const b=t.boards.find(x=>x<=boardsN()&&!occ.has(x));if(b==null)return;
  m.board=b;occ.add(b);busy.add(m.a);busy.add(m.b);}));}

/* --- Anzeige --- */
function canPlay(m){return playable(m)&&m.board&&(isStaff()||m.a===meId||m.b===meId);}
function matchHTML(t,m){if(!real(m.a)&&!real(m.b))return'';if(m.bye&&!real(m.a)&&m.br!=='W')return'';
 const nm=id=>id==='BYE'?'<span class="muted">Freilos</span>':id?`${AV(U(id))} ${esc(U(id).nick)}`:'<span class="muted">—</span>';
 const cls=id=>m.winner==='DRAW'?'':m.winner&&!m.bye?(m.winner===id?'w':'l'):m.bye&&real(id)?'w':'';
 return `<div class="match">${playable(m)?`<div class="row small" style="margin-bottom:4px">${m.board?`<span class="badge g">Board ${m.board}</span>`:t.mode==='league'&&m.r!==curDay(t)?`<span class="badge">geplant</span>`:`<span class="badge">wartet auf Board</span>`}<span class="sp"></span><span class="muted">${fmtShort(fmtOf(t,m))}</span></div>`:m.winner==='DRAW'?`<div class="small" style="margin-bottom:4px"><span class="badge y">🤝 Unentschieden</span></div>`:''}
 <div class="pl ${cls(m.a)}"><span>${nm(m.a)}</span><b>${m.winner&&!m.bye?m.la:''}</b></div>
 <div class="pl ${cls(m.b)}"><span>${nm(m.b)}</span><b>${m.winner&&!m.bye?m.lb:''}</b></div>
 ${canPlay(m)||(isStaff()&&playable(m))?`<div class="row" style="margin-top:6px">${canPlay(m)?`<button class="pri sm sp" onclick="playMatch('${t.id}','${m.id}')">▶ Spielen</button>`:''}${isStaff()?`<button class="sm" onclick="manualRes('${t.id}','${m.id}')" title="Ergebnis von Hand eintragen">✎</button>`:''}</div>`:''}</div>`;}
function bracketHTML(t,br,rounds,nameFn){return `<div class="bracket">${rounds.map(r=>{const inner=t.matches.filter(m=>m.br===br&&m.r===r).sort((a,b)=>a.s-b.s).map(m=>matchHTML(t,m)).join('');
 return inner?`<div class="round"><div class="muted small" style="text-align:center">${nameFn(r)}</div>${inner}</div>`:'';}).join('')}</div>`;}
function rName(t,r){const left=t.rounds-r;return left===1?'Finale':left===2?'Halbfinale':left===3?'Viertelfinale':left===4?'Achtelfinale':'Runde '+(r+1);}
const rng=n=>[...Array(n).keys()];
const tblHTML=(rows,extra)=>`<table><tr><th>#</th><th>Spieler</th><th>Sp.</th><th>S</th><th>U</th><th>Ergebnis</th><th>Pkt.</th>${extra?'<th>Buchh.</th>':''}</tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${AV(U(r.id))} ${esc(U(r.id).nick)}</td><td>${r.sp}</td><td>${r.s}</td><td>${r.u}</td><td>${r.lf}:${r.la}</td><td><b>${r.pts}</b></td>${extra?`<td>${r.bh}</td>`:''}</tr>`).join('')}</table>`;
const openFirst=ms=>ms.slice().sort((a,b)=>(!!a.winner)-(!!b.winner)||a.r-b.r);
function vTourView(id){const t=S.tournaments.find(x=>x.id===id);if(!t){view='tour';return vTour();}
 let body='';
 if(t.mode==='ko'||(t.mode==='groups'&&t.phase==='ko'))body+=`<div class="card"><h3>${t.mode==='groups'?'K.-o.-Runde':'Turnierbaum'}</h3>${bracketHTML(t,'W',rng(t.rounds),r=>rName(t,r))}</div>`;
 if(t.mode==='dko'){body+=`<div class="card"><h3>Gewinnerrunde</h3>${bracketHTML(t,'W',rng(t.rounds),r=>r===t.rounds-1?'WB-Finale':'Runde '+(r+1))}</div>`;
  if(t.lrounds)body+=`<div class="card"><h3>Verliererrunde</h3>${bracketHTML(t,'L',rng(t.lrounds).map(i=>i+1),r=>r===t.lrounds?'LB-Finale':'V-Runde '+r)}</div>`;
  body+=`<div class="card"><h3>Grand Final</h3><div style="max-width:260px">${t.matches.filter(m=>m.br==='GF').map(m=>matchHTML(t,m)).join('')}</div></div>`;}
 if(t.mode==='groups')t.groups.forEach((g,gi)=>{const ms=t.matches.filter(m=>m.br==='G'&&m.g===gi);
  body+=`<div class="card" style="overflow-x:auto"><h3>Gruppe ${String.fromCharCode(65+gi)} <span class="muted small">· die besten ${t.qual} kommen weiter</span></h3>${tblHTML(table(g,ms))}
  <div class="grid2" style="margin-top:12px">${openFirst(ms).map(m=>matchHTML(t,m)).join('')}</div></div>`;});
 if(t.mode==='swiss'){body+=`<div class="card" style="overflow-x:auto"><h3>Tabelle <span class="muted small">· Runde ${t.curRound} von ${t.swissRounds}</span></h3>${tblHTML(swissTable(t),true)}</div>`;
  for(let r=t.curRound;r>=1;r--)body+=`<div class="card"><h3>Runde ${r}</h3><div class="grid2">${t.matches.filter(m=>m.br==='S'&&m.r===r).map(m=>matchHTML(t,m)).join('')}</div></div>`;}
 if(t.mode==='league')body+=leagueView(t);
 if(t.mode==='rr')body+=`<div class="card" style="overflow-x:auto"><h3>Tabelle</h3>${tblHTML(table(t.players,t.matches))}</div><div class="card"><h3>Spiele</h3><div class="grid2">${openFirst(t.matches).map(m=>matchHTML(t,m)).join('')}</div></div>`;
 const tg=S.games.filter(g=>g.tid===t.id);const best={};tg.forEach(g=>g.players.forEach(p=>{const a=p.pts/p.darts*3;if(!best[p.id]||a>best[p.id])best[p.id]=a;}));
 const ba=Object.entries(best).sort((a,b)=>b[1]-a[1])[0];
 return `<div class="row" style="margin-bottom:12px"><button class="sm ghost" onclick="go('tour')">← Zurück</button><h2 class="sp" style="margin:0">${esc(t.name)}</h2>
 ${me().role==='admin'?`<button class="sm red" onclick="delTour('${t.id}')">Löschen</button>`:''}</div>
 <div class="muted small" style="margin-bottom:12px">${t.kind==='training'?'Training':'Turnier'} · ${MODES[t.mode]} · ${t.start} · ${fmtStr(tFmt(t))}${t.bestOfFinal&&['ko','dko','groups'].includes(t.mode)?` (Finale Best of ${t.bestOfFinal})`:''} · ${t.dOut?'Double Out':'Single Out'} · Boards ${t.boards.join(', ')}</div>
 ${t.status==='done'?`<div class="banner"><h3 style="margin:0">🏆 Sieger: ${AV(U(t.winner))} ${esc(U(t.winner).nick)}</h3></div>`:''}
 ${ba?`<div class="muted small" style="margin-bottom:12px">Bester Match-Average: <b style="color:var(--text)">${esc(U(ba[0]).nick)} – ${f1(ba[1])}</b></div>`:''}${body}`;}
function playMatch(tid,mid,fromBoard){const t=S.tournaments.find(x=>x.id===tid),m=t.matches.find(x=>x.id===mid);startX01([m.a,m.b],t.start,fmtOf(t,m),t.dOut,{tid,mid,board:fromBoard||null});}
function manualRes(tid,mid){const t=S.tournaments.find(x=>x.id===tid),m=t.matches.find(x=>x.id===mid);const f=fmtOf(t,m);const need=fmtNeed(f.bo);const unit=f.sets?'Sets':'Legs';
 modal(`<h3>Ergebnis eintragen</h3><p class="muted small">${fmtStr(f)} – Sieger braucht ${need} ${unit}${f.bo%2===0&&!isKO(m)?`, bei ${f.bo/2}:${f.bo/2} unentschieden`:''}.</p>
 <div class="row"><span class="sp">${AV(U(m.a))} ${esc(U(m.a).nick)}</span><input id="ra" type="number" min="0" max="${need}" style="max-width:80px" placeholder="${unit}"></div>
 <div class="row" style="margin-top:8px"><span class="sp">${AV(U(m.b))} ${esc(U(m.b).nick)}</span><input id="rb" type="number" min="0" max="${need}" style="max-width:80px" placeholder="${unit}"></div>
 <div class="row" style="margin-top:16px"><button class="ghost sp" onclick="closeModal()">Abbrechen</button><button class="pri sp" onclick="doManual('${tid}','${mid}')">Speichern</button></div>`);}
function doManual(tid,mid){const t=S.tournaments.find(x=>x.id===tid),m=t.matches.find(x=>x.id===mid);const f=fmtOf(t,m);const need=fmtNeed(f.bo);
 const a=+document.getElementById('ra').value,b=+document.getElementById('rb').value;
 const win=Math.max(a,b)===need&&Math.min(a,b)<need&&a>=0&&b>=0;const draw=f.bo%2===0&&!isKO(m)&&a===b&&a===f.bo/2;
 if(!win&&!draw)return toast(`Einer braucht genau ${need}${f.bo%2===0&&!isKO(m)?` – oder ${f.bo/2}:${f.bo/2} für unentschieden`:''}`);
 applyResult(tid,mid,draw?'DRAW':(a>b?m.a:m.b),a,b);save();closeModal();render();}
function delTour(id){ask('Turnier wirklich löschen?','Löschen',()=>{S.tournaments=S.tournaments.filter(t=>t.id!==id);save();go('tour');},true);}

/* --- Boards-Ansicht --- */
function boardMatch(b){for(const t of activeTours()){const m=t.matches.find(m=>m.board===b&&playable(m));if(m)return{t,m};}return null;}
function vBoards(){const n=boardsN();const waiting=activeTours().flatMap(t=>t.matches.filter(m=>playable(m)&&!m.board).map(m=>({t,m})));
 return `<div class="ph"><div class="row"><h1 class="sp">Boards</h1>${boardStepper()}</div><p>Spiele werden automatisch auf freie Boards verteilt</p></div>
 <div class="grid2">${rng(n).map(i=>i+1).map(b=>{const x=boardMatch(b);return `<div class="card" style="margin:0"><div class="row"><h3 class="sp" style="margin:0">🎯 Board ${b}</h3><span class="badge ${x?'y':'g'}">${x?'belegt':'frei'}</span></div>
  ${x?`<div class="muted small" style="margin-top:8px">${esc(x.t.name)} · ${fmtShort(fmtOf(x.t,x.m))}</div><div style="font-size:18px;font-weight:700;margin:6px 0 10px">${AV(U(x.m.a))} ${esc(U(x.m.a).nick)} <span class="muted">vs</span> ${AV(U(x.m.b))} ${esc(U(x.m.b).nick)}</div>
  <div class="row"><button class="pri sp" onclick="playMatch('${x.t.id}','${x.m.id}',${b})">▶ Starten</button><button class="sm" onclick="manualRes('${x.t.id}','${x.m.id}')">✎</button></div>`:`<p class="muted small">Kein Spiel zugeteilt.</p>`}
  <button class="ghost sm" style="width:100%;margin-top:10px" onclick="go('board',${b})">📱 Dieses Tablet ist Board ${b}</button></div>`;}).join('')}</div>
 <div class="card" style="margin-top:14px"><h3>Warteschlange (${waiting.length})</h3>${waiting.length?`<table>${waiting.map(({t,m})=>`<tr><td>${AV(U(m.a))} ${esc(U(m.a).nick)} vs ${AV(U(m.b))} ${esc(U(m.b).nick)}</td><td class="muted small">${esc(t.name)}</td></tr>`).join('')}</table>`:'<p class="muted small">Keine wartenden Spiele.</p>'}</div>`;}
function vBoard(b){const x=boardMatch(b);
 return `<div class="row" style="margin-bottom:12px"><button class="sm ghost" onclick="go('boards')">← Alle Boards</button></div>
 <div class="card" style="text-align:center;padding:30px 16px"><div class="muted">Dieses Tablet</div><div class="big-target">Board ${b}</div>
 ${x?`<div class="muted" style="margin-top:18px">${esc(x.t.name)} · ${x.t.start} · ${fmtStr(fmtOf(x.t,x.m))}</div>
 <div style="font-size:30px;font-weight:800;margin:14px 0">${AV(U(x.m.a))} ${esc(U(x.m.a).nick)}<div class="muted" style="font-size:18px;margin:4px 0">gegen</div>${AV(U(x.m.b))} ${esc(U(x.m.b).nick)}</div>
 <button class="pri" style="padding:18px 40px;font-size:20px" onclick="playMatch('${x.t.id}','${x.m.id}',${b})">▶ Spiel starten</button>`
 :`<p class="muted" style="margin-top:18px">Gerade kein Spiel – sobald ein Spiel diesem Board zugeteilt wird, erscheint es hier.</p>`}</div>`;}
